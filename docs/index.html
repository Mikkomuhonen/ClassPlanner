<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClassPlanner – Viikkosuunnitelma</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* ---- Design tokens ---- */
      --ink: #1c2b3a;
      --ink-soft: #2c4055;
      --paper: #f6f4ef;
      --chalk-blue: #3d6b8c;
      --chalk-blue-soft: #eaf1f5;
      --marker-amber: #b6650a;
      --marker-amber-soft: #fbf0dd;
      --signal-green: #2f7a4f;
      --signal-green-soft: #e9f5ee;
      /* ---- Type scale ---- */
      --font-body: 'Inter', system-ui, -apple-system, sans-serif;
      --fs-xs: 0.72rem;
      --fs-sm: 0.82rem;
      --fs-base: 0.9rem;
      --fs-md: 1.0rem;
      --fs-lg: 1.15rem;
    }

    body { font-family: var(--font-body); font-size: 14px; background: var(--paper); color: var(--ink); }

    /* ---- TOOLBAR ---- */
    #toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: var(--ink);
      color: white;
      gap: 12px;
      flex-wrap: wrap;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .toolbar-left h1 { font-size: var(--fs-lg); font-weight: 700; letter-spacing: -0.2px; }
    .toolbar-center { display: flex; align-items: center; gap: 10px; font-size: var(--fs-base); font-weight: 500; }
    .toolbar-right { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    #toolbar button {
      background: rgba(255,255,255,0.08);
      color: white;
      border: 1px solid rgba(255,255,255,0.2);
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: var(--fs-sm);
      transition: background 0.15s, border-color 0.15s;
    }
    #toolbar button:hover { background: rgba(255,255,255,0.16); border-color: rgba(255,255,255,0.32); }
    body.edit-mode #editToggle { background: var(--marker-amber); color: white; border-color: var(--marker-amber); font-weight: 600; }
    #signInBtn { background: var(--chalk-blue); border-color: var(--chalk-blue); font-weight: 600; }
    #signInBtn:hover { background: #33607e; }
    #authError { color: #ffb4a8; }

    /* ---- SIGNED-OUT OVERLAY ---- */
    #signedOutOverlay {
      text-align: center;
      padding: 90px 20px 100px;
      color: var(--ink);
    }
    #signedOutOverlay h2 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.3px;
      margin-bottom: 10px;
      color: var(--ink);
    }
    #signedOutOverlay p {
      font-size: var(--fs-md);
      color: #5b6472;
      max-width: 360px;
      margin: 0 auto;
    }

    /* ---- MAIN ---- */
    main { padding: 16px; max-width: 1400px; margin: 0 auto; }

    /* ---- GRID TABLE ---- */
    #grid {
      width: 100%;
      table-layout: fixed;
      border-collapse: collapse;
      background: white;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
      border-radius: 6px;
      overflow: hidden;
    }
    #grid th, #grid td { border: 1px solid #d9d3c7; vertical-align: top; }
    #grid thead th {
      background: var(--ink-soft);
      color: white;
      padding: 8px 10px;
      font-size: var(--fs-sm);
      text-align: center;
      font-weight: 600;
      position: relative;
    }
    #grid thead th:first-child { width: 76px; }
    #grid thead th.day-today { background: var(--chalk-blue); }
    #grid thead th.day-today::after {
      content: '';
      position: absolute; left: 0; right: 0; bottom: 0;
      height: 3px; background: #ffffff;
    }
    #gridBody td.day-today { box-shadow: inset 3px 0 0 var(--chalk-blue); }

    .time-cell {
      padding: 5px 7px;
      font-size: var(--fs-sm);
      font-weight: 700;
      color: #4b4438;
      width: 76px;
      text-align: center;
      vertical-align: middle;
      background: #faf8f3;
    }

    .lesson-cell {
      height: auto;
      min-height: 40px;
      padding: 5px 7px;
      cursor: pointer;
      transition: background 0.1s;
      word-wrap: break-word;
      overflow-wrap: break-word;
    }
    .lesson-cell:hover { background: var(--chalk-blue-soft); }
    .lesson-cell.has-content { background: white; box-shadow: inset 3px 0 0 var(--chalk-blue); }
    .lesson-cell.has-content:hover { background: var(--chalk-blue-soft); }
    .lesson-cell.has-subject-color:hover { filter: brightness(0.95); }
    .cell-time { font-size: var(--fs-xs); color: #6b7280; margin-bottom: 2px; }
    .cell-participants { font-size: var(--fs-xs); color: #6b7280; margin-bottom: 2px; font-style: italic; }

    .cell-text { font-size: var(--fs-sm); line-height: 1.35; color: #374151; white-space: pre-wrap; }
    .cell-break { font-size: 0.7em; color: #9ca3af; text-align: center; padding: 3px 0 2px; border-top: 1px dashed #e5e7eb; margin-top: 4px; }
    .cell-lunch-break { font-size: var(--fs-xs); color: var(--marker-amber); background: var(--marker-amber-soft); border-radius: 3px; padding: 2px 5px; margin-top: 4px; display: inline-block; }
    .break-entry-lunch {
      display: inline-flex; align-items: center; gap: 2px;
      background: var(--marker-amber-soft); border: 1px solid #e2b060; border-radius: 4px;
      padding: 2px 4px; font-size: 0.78em;
    }
    .break-lunch-btn {
      background: none; border: 1px dashed var(--marker-amber); color: var(--marker-amber);
      border-radius: 4px; cursor: pointer; padding: 0px 5px; font-size: 0.78em; line-height: 1.6;
    }
    .break-lunch-btn:hover { background: var(--marker-amber-soft); }
    .cell-lunch { font-size: var(--fs-xs); color: var(--marker-amber); background: var(--marker-amber-soft); border-radius: 3px; padding: 2px 5px; margin-top: 4px; display: inline-block; }
    .cell-lunch.is-default { opacity: 0.75; font-style: italic; }
    .cell-supervision { font-size: var(--fs-xs); color: var(--signal-green); background: var(--signal-green-soft); border-radius: 3px; padding: 2px 5px; margin-top: 4px; display: inline-block; }
    .cell-indicator-row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin-top: 4px; }
    .cell-indicator-row .cell-break,
    .cell-indicator-row .cell-lunch,
    .cell-indicator-row .cell-supervision { margin-top: 0; }
    .cell-indicator-row .cell-break { border-top: none; padding: 2px 5px; background: #f3f4f6; border-radius: 3px; }
    .popup-lunch-row {
      display: flex; align-items: center; gap: 8px; padding: 8px 15px;
      border-top: 1px solid #e5e7eb; flex-shrink: 0; background: var(--marker-amber-soft); flex-wrap: wrap;
    }
    .popup-lunch-row label { font-size: var(--fs-sm); color: var(--marker-amber); }
    .lunch-time-input { border: 1px solid #e2b060; border-radius: 4px; padding: 3px 6px; font-size: 0.85em; outline: none; width: 100px; }
    .lunch-time-input:focus { border-color: var(--marker-amber); }
    .lunch-dur-select { border: 1px solid #e2b060; border-radius: 4px; padding: 3px 6px; font-size: 0.82em; outline: none; }
    #clearLunchBtn { background: none; border: none; color: var(--marker-amber); cursor: pointer; font-size: 0.78em; text-decoration: underline; padding: 0; }
    .cell-time.time-overridden { color: var(--marker-amber); font-weight: 600; }

    /* ---- BREAKS SECTION ---- */
    #breaksSection {
      display: none;
      margin-top: 18px;
      background: white;
      border-radius: 6px;
      padding: 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }
    body.edit-mode #breaksSection { display: block; }
    #breaksSection h2 { font-size: 0.95em; font-weight: 600; margin-bottom: 12px; color: #374151; }
    .breaks-day-row { display: flex; align-items: center; gap: 5px; margin-bottom: 10px; flex-wrap: wrap; }
    .breaks-day-label { font-weight: 600; font-size: 0.82em; color: #374151; min-width: 90px; flex-shrink: 0; }
    .break-slot-label { font-size: 0.75em; color: #9ca3af; padding: 0 2px; }
    .break-add-btn {
      background: none; border: 1px dashed #9ca3af; color: #6b7280;
      border-radius: 4px; cursor: pointer; padding: 0px 5px; font-size: 0.78em; line-height: 1.6;
    }
    .break-add-btn:hover { border-color: #3b82f6; color: #3b82f6; }
    .break-entry {
      display: inline-flex; align-items: center; gap: 2px;
      background: #f0fdf4; border: 1px solid #86efac; border-radius: 4px;
      padding: 2px 4px; font-size: 0.78em;
    }
    .break-dur-dec, .break-dur-inc {
      background: white; border: 1px solid #d1d5db; border-radius: 2px;
      cursor: pointer; width: 18px; height: 18px; font-size: 0.85em;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .break-dur-dec:hover, .break-dur-inc:hover { background: #e5e7eb; }
    .break-del-entry { background: none; border: none; cursor: pointer; color: #9ca3af; font-size: 1em; padding: 0 1px; }
    .break-del-entry:hover { color: #dc2626; }
    .lunch-config-row { display: flex; align-items: center; gap: 5px; margin-left: 8px; padding-left: 8px; border-left: 1px dashed #e5e7eb; flex-wrap: wrap; }
    .lunch-config-entry { display: flex; align-items: center; gap: 4px; background: var(--marker-amber-soft, #fef3c7); border-radius: 4px; padding: 2px 6px; font-size: 0.78em; }
    .lunch-config-entry select, .lunch-config-entry input[type=time] { border: 1px solid #e2b060; border-radius: 3px; font-size: 0.95em; padding: 1px 3px; background: white; }
    .lunch-config-add-btn { background: none; border: 1px dashed #e2b060; color: #92400e; border-radius: 4px; cursor: pointer; font-size: 0.78em; padding: 2px 7px; }
    .lunch-config-add-btn:hover { border-style: solid; background: var(--marker-amber-soft, #fef3c7); }

    /* ---- POPUP TIME ---- */
    .popup-time-row {
      display: flex; align-items: center; gap: 8px; padding: 8px 15px;
      border-bottom: 1px solid #e5e7eb; flex-shrink: 0; background: white;
    }
    .popup-time-row.has-override { background: #fffbeb; }
    .popup-time-row label { font-size: 0.82em; color: #6b7280; }
    .popup-time-input { border: 1px solid #e5e7eb; border-radius: 4px; padding: 3px 6px; font-size: 0.85em; outline: none; width: 90px; }
    .popup-time-input:focus { border-color: #3b82f6; }
    #popupResetTime { background: none; border: none; color: #6b7280; cursor: pointer; font-size: 0.78em; padding: 2px 6px; margin-left: auto; }
    #popupResetTime:hover { color: #3b82f6; text-decoration: underline; }
    .popup-copy-row {
      display: flex; align-items: center; gap: 8px; padding: 8px 15px;
      border-top: 1px solid #e5e7eb; flex-shrink: 0; background: #f9fafb;
      flex-wrap: wrap;
    }
    .popup-copy-row label { font-size: 0.82em; color: #6b7280; }
    .popup-copy-select { border: 1px solid #e5e7eb; border-radius: 4px; padding: 3px 6px; font-size: 0.82em; outline: none; }
    .popup-copy-select:focus { border-color: #3b82f6; }
    #copySlotBtn { background: none; border: 1px solid #3b82f6; color: #3b82f6; border-radius: 4px; cursor: pointer; font-size: 0.78em; padding: 3px 8px; }
    #copySlotBtn:hover { background: #eff6ff; }
    #copySlotFeedback { font-size: 0.78em; color: #16a34a; }
    .copy-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; padding-top: 8px; border-top: 1px dashed #e5e7eb; flex-wrap: wrap; }
    .copy-row label { font-size: 0.82em; color: #6b7280; }
    .copy-day-select { border: 1px solid #e5e7eb; border-radius: 4px; padding: 3px 6px; font-size: 0.82em; outline: none; }
    .copy-day-btn { background: none; border: 1px solid #3b82f6; color: #3b82f6; border-radius: 4px; cursor: pointer; font-size: 0.78em; padding: 3px 8px; }
    .copy-day-btn:hover { background: #eff6ff; }
    .copy-all-btn { background: none; border: 1px solid #7c3aed; color: #7c3aed; border-radius: 4px; cursor: pointer; font-size: 0.78em; padding: 3px 8px; }
    .copy-all-btn:hover { background: #ede9fe; }
    .undo-copy-btn { background: none; border: none; color: #3b82f6; cursor: pointer; font-size: 0.78em; text-decoration: underline; padding: 0 4px; }
    #copyDayFeedback { font-size: 0.78em; color: #16a34a; }

    /* ---- REGISTRY SECTION ---- */
    #registrySection {
      display: none;
      margin-top: 18px;
      background: white;
      border-radius: 6px;
      padding: 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }
    body.edit-mode #registrySection { display: block; }
    #registrySection h2 { font-size: 0.95em; font-weight: 600; margin-bottom: 12px; color: #374151; }

    .reg-group { border: 1px solid #e5e7eb; border-radius: 6px; margin-bottom: 10px; overflow: hidden; }
    .reg-group-header { display: flex; align-items: center; gap: 8px; background: #f9fafb; padding: 6px 10px; }
    .reorder-btn { background: none; border: 1px solid #d1d5db; border-radius: 3px; cursor: pointer; font-size: 0.75em; padding: 1px 5px; color: #6b7280; line-height: 1.4; }
    .reorder-btn:hover { border-color: #3b82f6; color: #3b82f6; }
    .reorder-btn:disabled { opacity: 0.25; cursor: default; border-color: #e5e7eb; color: #d1d5db; }
    .group-name-input {
      border: none; background: transparent; font-weight: 600; font-size: 0.9em;
      flex: 1; outline: none; color: #1f2937;
    }
    .group-name-input:focus { border-bottom: 1px solid #3b82f6; }
    .reg-group-members { padding: 8px 10px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .member-item {
      display: flex; align-items: center; gap: 3px;
      background: #eff6ff; border: 1px solid #bfdbfe;
      border-radius: 4px; padding: 2px 4px 2px 8px; font-size: 0.82em;
    }
    .member-name-input { border: none; background: transparent; width: 88px; outline: none; font-size: 0.9em; }
    .del-btn { background: none; border: none; cursor: pointer; color: #9ca3af; font-size: 1em; padding: 0 2px; line-height: 1; }
    .del-btn:hover { color: #dc2626; }
    .add-member-btn, #addGroupBtn {
      background: none; border: 1px dashed #9ca3af; color: #6b7280;
      border-radius: 4px; cursor: pointer; padding: 3px 8px; font-size: 0.78em;
    }
    .add-member-btn:hover, #addGroupBtn:hover { border-color: #3b82f6; color: #3b82f6; }
    #addGroupBtn { display: inline-block; margin-top: 8px; }

    /* ---- RHYTHMS SECTION ---- */
    #rhythmsSection {
      display: none;
      margin-top: 18px;
      background: white;
      border-radius: 6px;
      padding: 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }
    body.edit-mode #rhythmsSection { display: block; }
    #rhythmsSection h2 { font-size: 0.95em; font-weight: 600; margin-bottom: 12px; color: #374151; }
    .rhythm-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .rhythm-name-input {
      border: 1px solid #e5e7eb; border-radius: 4px; padding: 3px 8px;
      width: 60px; font-size: 0.9em; font-weight: 600; outline: none; color: #1f2937;
    }
    .rhythm-name-input:focus { border-color: #3b82f6; }
    .rhythm-time-input { border: 1px solid #e5e7eb; border-radius: 4px; padding: 3px 6px; font-size: 0.85em; outline: none; }
    .rhythm-time-input:focus { border-color: #3b82f6; }
    #addRhythmBtn {
      background: none; border: 1px dashed #9ca3af; color: #6b7280;
      border-radius: 4px; cursor: pointer; padding: 3px 8px; font-size: 0.78em; margin-top: 4px;
    }
    #addRhythmBtn:hover { border-color: #3b82f6; color: #3b82f6; }
    .day-th-select {
      font-size: 0.78em; background: rgba(255,255,255,0.15); color: white;
      border: 1px solid rgba(255,255,255,0.3); border-radius: 3px; padding: 1px 4px; margin-left: 3px;
    }

    /* ---- POPUP ---- */
    #popupOverlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }
    #popupOverlay.open { display: flex; }
    #popup {
      background: white;
      border-radius: 8px;
      width: 440px;
      max-width: 95vw;
      max-height: 88vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 12px 40px rgba(0,0,0,0.22);
      overflow: hidden;
    }
    #popupHeader {
      display: flex; align-items: center; justify-content: space-between;
      padding: 11px 15px; background: var(--ink-soft); color: white; flex-shrink: 0;
    }
    #popupBody {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
    }
    #popupTitle { font-weight: 600; font-size: 0.9em; }
    #popupClose { background: none; border: none; color: white; cursor: pointer; font-size: 1.1em; padding: 2px 5px; border-radius: 3px; }
    #popupClose:hover { background: rgba(255,255,255,0.15); }
    .popup-footer-row {
      display: flex; align-items: center; gap: 8px; padding: 10px 15px;
      border-top: 1px solid #e5e7eb; flex-shrink: 0; background: #f9fafb;
    }
    .popup-footer-row button { font-size: 0.85em; border-radius: 4px; padding: 6px 16px; cursor: pointer; }
    #popupCancelBtn { background: white; border: 1px solid #d1d5db; color: var(--ink-soft, #374151); margin-left: auto; }
    #popupCancelBtn:hover { background: #f3f4f6; }
    #popupSaveBtn { background: var(--chalk-blue); border: 1px solid var(--chalk-blue); color: white; font-weight: 600; }
    #popupSaveBtn:hover { filter: brightness(1.08); }
    #popupSaveFeedback { font-size: 0.78em; color: #16a34a; }
    #popupParticipants { padding: 12px 15px; border-bottom: 1px solid #e5e7eb; flex-shrink: 0; }
    .popup-group { margin-bottom: 10px; }
    .popup-group:last-child { margin-bottom: 0; }
    .popup-group-header { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; font-weight: 600; font-size: 0.82em; color: #374151; }
    .popup-quick-btn {
      background: none; border: 1px solid #3b82f6; color: #3b82f6;
      border-radius: 3px; cursor: pointer; font-size: 0.72em; padding: 1px 6px;
    }
    .popup-quick-btn:hover { background: #eff6ff; }
    .popup-select-all-row { margin-bottom: 8px; }
    .popup-select-all-btn { font-size: 0.78em; padding: 3px 8px; font-weight: 600; }
    .popup-members { display: flex; flex-wrap: wrap; gap: 5px; }
    .popup-member-btn {
      padding: 3px 10px; border-radius: 4px; border: 1px solid #d1d5db;
      background: white; cursor: pointer; font-size: 0.82em; transition: all 0.1s;
    }
    .popup-member-btn:hover { border-color: #3b82f6; color: #3b82f6; }
    .popup-member-btn.selected { background: #3b82f6; color: white; border-color: #3b82f6; }
    .popup-selected-row { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
    .popup-selected-chip { padding: 3px 8px; border-radius: 4px; background: #3b82f6; color: white; border: none; cursor: pointer; font-size: 0.82em; display: flex; align-items: center; gap: 4px; }
    .popup-selected-chip:hover { background: #2563eb; }
    .popup-add-row { display: flex; gap: 5px; margin-bottom: 8px; }
    .popup-add-input { flex: 1; border: 1px solid #d1d5db; border-radius: 4px; padding: 3px 8px; font-size: 0.82em; font-family: inherit; }
    .popup-add-input:focus { outline: none; border-color: #3b82f6; }
    .popup-add-btn { background: #3b82f6; color: white; border: none; border-radius: 4px; padding: 3px 10px; cursor: pointer; font-size: 0.82em; }
    .popup-add-btn:hover { background: #2563eb; }
    #popupText {
      display: block; width: 100%; box-sizing: border-box;
      padding: 12px 15px; border: none; outline: none;
      resize: vertical; min-height: 110px; max-height: 320px; font-size: 0.88em;
      font-family: inherit; line-height: 1.5; background: #fafafa; flex-shrink: 0;
    }

    /* ---- PRINT ---- */
    /* ---- NOTES & TODOS ---- */
    #notesArea { max-width: 1400px; margin: 16px auto 0; padding: 0 16px 24px; }
    .notes-row { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
    .notes-panel { flex: 1; min-width: 300px; background: white; border-radius: 6px; padding: 14px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
    .todo-panel { width: 300px; background: white; border-radius: 6px; padding: 14px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
    .notes-header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; font-weight: 600; font-size: 0.9em; color: #374151; }
    .notes-header span { flex: 1; }
    .notes-color-btns { display: flex; gap: 4px; }
    .color-btn { width: 18px; height: 18px; border-radius: 50%; border: 1px solid #d1d5db; cursor: pointer; padding: 0; }
    .color-btn:hover { border-color: #6b7280; }
    #addNoteBtn, #addTodoBtn, #clearNotesBtn, #clearTodosBtn { background: #f3f4f6; border: 1px solid #d1d5db; border-radius: 4px; padding: 2px 10px; cursor: pointer; font-size: 0.8em; white-space: nowrap; }
    #addNoteBtn:hover, #addTodoBtn:hover, #clearNotesBtn:hover, #clearTodosBtn:hover { background: #e5e7eb; }

  <script>
    // =================== CONSTANTS ===================
    const DAYS      = ['Ma', 'Ti', 'Ke', 'To', 'Pe'];
    const DAY_FULL  = ['Maanantai', 'Tiistai', 'Keskiviikko', 'Torstai', 'Perjantai'];

    // =================== STATE ===================
    let dayBreaks = [];       // [dayIdx][{afterLesson, duration}]
    let dayLunch = [null, null, null, null, null]; // [dayIdx]: {slot, start, duration} | null — default lunch per day
    let registry = [];        // [{name:string, members:string[]}]
    let weekData = {};        // {weekKey: {dayAbbr: {slotIdx: {participants:[], text:"", startOverride?, endOverride?}}}}
    let currentWeekOffset = 0;
    let dirty = false;
    let popupState = null;    // {dayIdx, slotIdx} or null
    let popupParticipants = [];
    let subjects = [];            // [{code, name, color}]
    let subjectsUnsub = null;
    let popupSubjects = [];       // codes selected in current popup
    let popupIndicatorOrder = ['break', 'supervision', 'lunch']; // display order for the current popup's slot
    let popupIndicatorOrderChanged = false; // true once the user manually reorders in this popup session
    const INDICATOR_ORDER_LABELS = { break: '░ Välitunti', supervision: '🏃 Välkkävalvonta', lunch: '🍽️ Ruokailu' };
    let rhythms = [
      { name: 'A', startMinutes: 505 },
      { name: 'B', startMinutes: 510 },
    ];
    let dayRhythms = [0, 0, 0, 0, 0];
    let undoState = null;  // {weekKey, affected:[{dayIdx, breaks, rhythm, cells}]}

    // =================== SUBJECTS ===================
    function subjectsDocRef(uid) {
      const { db, doc } = window.cpFirebase;
      return doc(db, 'users', uid, 'subjects', 'main');
    }
    async function loadSubjects() {
      const uid = currentUid();
      if (!uid) { subjects = []; return; }
      try {
        const { getDoc } = window.cpFirebase;
        const snap = await getDoc(subjectsDocRef(uid));
        subjects = (snap.exists() && Array.isArray(snap.data().registry)) ? snap.data().registry : [];
      } catch (e) {
        console.error('Oppiainerekisterin lataus epäonnistui:', e);
        subjects = [];
      }
      subscribeToSubjects(uid);
    }
    function subscribeToSubjects(uid) {
      const { onSnapshot } = window.cpFirebase;
      if (subjectsUnsub) { subjectsUnsub(); subjectsUnsub = null; }
      subjectsUnsub = onSnapshot(subjectsDocRef(uid), (snap) => {
        if (!snap.exists() || !Array.isArray(snap.data().registry)) return;
        const incoming = snap.data().registry;
        // Skip re-rendering when the incoming data matches what we already have
        // in memory: this covers both the local optimistic echo (hasPendingWrites)
        // and the later server-ack echo of our own write (hasPendingWrites: false),
        // both of which would otherwise destroy focus in any input the user is
        // actively typing in (e.g. the subject name field) on every keystroke.
        if (JSON.stringify(incoming) === JSON.stringify(subjects)) return;
        subjects = incoming;
        renderRegistry(); renderSubjectsSection(); renderGrid();
      }, (err) => console.error('Oppiainerekisterin reaaliaikaseuranta epäonnistui:', err));
    }
    async function saveSubjects() {
      const uid = currentUid();
      if (!uid) return;
      try {
        const { setDoc } = window.cpFirebase;
        await setDoc(subjectsDocRef(uid), { registry: subjects });
      } catch (e) {
        console.error('Oppiainerekisterin tallennus epäonnistui:', e);
      }
    }
    function normalizeCode(s) {
      return s.trim().toUpperCase();
    }

    // =================== TIME UTILS ===================
    function minToTime(m) {
      return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
    }

    // =================== COLOR UTILS ===================
    function hexToRgba(hex, alpha) {
      if (!hex) return null;
      const m = hex.replace('#', '');
      const full = m.length === 3 ? m.split('').map(c => c + c).join('') : m;
      const r = parseInt(full.substring(0, 2), 16);
      const g = parseInt(full.substring(2, 4), 16);
      const b = parseInt(full.substring(4, 6), 16);
      if ([r, g, b].some(Number.isNaN)) return null;
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function getWeekInfo(offset) {
      const now = new Date();
      const today = new Date(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()));
      const dow = (today.getUTCDay() + 6) % 7; // 0=Mon
      const monday = new Date(today);
      monday.setUTCDate(today.getUTCDate() - dow + offset * 7);
      const dates = [];
      for (let i = 0; i < 5; i++) {
        const d = new Date(monday);
        d.setUTCDate(monday.getUTCDate() + i);
        dates.push(d);
      }
      // ISO week: based on Thursday of the week
      const thu = new Date(monday);
      thu.setUTCDate(monday.getUTCDate() + 3);
      const yearStart = new Date(Date.UTC(thu.getUTCFullYear(), 0, 1));
      const week = Math.ceil(((thu - yearStart) / 86400000 + 1) / 7);
      return { year: thu.getUTCFullYear(), week, dates };
    }

    function getWeekKey(offset) {
      const { year, week } = getWeekInfo(offset);
      return `${year}_W${String(week).padStart(2, '0')}`;
    }

    function fmtDate(d) {
      return `${d.getUTCDate()}.${d.getUTCMonth() + 1}.`;
    }

    function isTodayColumn(dayIdx) {
      const { dates } = getWeekInfo(currentWeekOffset);
      const d = dates[dayIdx];
      const now = new Date();
      return d.getUTCFullYear() === now.getFullYear() &&
             d.getUTCMonth() === now.getMonth() &&
             d.getUTCDate() === now.getDate();
    }

    // =================== SCHEDULE (per-day breaks) ===================
    const LESSON_COUNT = 7;

    function defaultDayBreaks() {
      return Array.from({ length: 5 }, () => []);
    }

    function computeDaySlotTime(dayIdx, slotIdx) {
      const startMin = rhythms[dayRhythms[dayIdx]].startMinutes;
      let time = startMin;
      for (let i = 0; i < slotIdx; i++) {
        time += 45;
        const brk = (dayBreaks[dayIdx] || []).find(b => b.afterLesson === i);
        if (brk) time += brk.duration;
      }
      return { start: time, end: time + 45 };
    }

    function computeCascadingSlotTime(dayIdx, slotIdx, weekKey) {
      const startMin = rhythms[dayRhythms[dayIdx]].startMinutes;
      let time = startMin;
      for (let i = 0; i < slotIdx; i++) {
        const prevCell = ((weekData[weekKey] || {})[DAYS[dayIdx]] || {})[String(i)];
        if (prevCell && prevCell.endOverride != null) {
          time = prevCell.endOverride;
        } else {
          time += 45;
        }
        const brk = (dayBreaks[dayIdx] || []).find(b => b.afterLesson === i);
        if (brk) time += brk.duration;
      }
      return { start: time, end: time + 45 };
    }

    function getCellTime(dayIdx, slotIdx, weekKey) {
      const cell = ((weekData[weekKey] || {})[DAYS[dayIdx]] || {})[String(slotIdx)];
      if (cell && cell.startOverride != null) {
        return { start: cell.startOverride, end: cell.endOverride };
      }
      return computeCascadingSlotTime(dayIdx, slotIdx, weekKey);
    }

    // Resolve the lunch info to display/edit for a slot: an explicit per-week
    // override (cell.lunchStart) wins; an explicit per-week "cleared" flag
    // suppresses the day's default lunch; otherwise fall back to the day's
    // configured default lunch (dayLunch) if it is attached to this slot.
    function getEffectiveLunch(dayIdx, slotIdx, cell) {
      if (cell && cell.lunchStart != null) {
        return { start: cell.lunchStart, duration: cell.lunchDuration || 15, isDefault: false };
      }
      if (cell && cell.lunchCleared) return null;
      const dl = dayLunch[dayIdx];
      if (dl && dl.slot === slotIdx) {
        return { start: dl.start, duration: dl.duration, isDefault: true };
      }
      return null;
    }

    // Resolve the break supervision info to display/edit for a slot: if the
    // teacher has an explicit start/duration set (cell.supervisionStart),
    // use it; otherwise fall back to the regular break's own time window
    // (lessonEndMin / the break's duration) so supervision defaults to
    // "during the break" unless a custom time is needed.
    function getEffectiveSupervision(cell, brk, lessonEndMin) {
      if (!(cell && cell.breakSupervision)) return null;
      const start = cell.supervisionStart != null ? cell.supervisionStart : lessonEndMin;
      const duration = cell.supervisionDuration != null ? cell.supervisionDuration : (brk ? brk.duration : 15);
      return { start, duration };
    }

    // Resolve the display order of the break, supervision, and lunch
    // indicators for a slot. A stored per-slot override (cell.indicatorOrder)
    // takes precedence; otherwise the three are ordered chronologically by
    // their effective start time (break/supervision default to the lesson's
    // end time when not otherwise specified), preserving break-then-
    // supervision-then-lunch as the tie-break order. Legacy data using the
    // older `lunchBeforeBreak` boolean is honored when no explicit order is
    // stored yet.
    function getIndicatorOrder(cell, brk, effSupervision, effLunch, lessonEndMin) {
      if (cell && Array.isArray(cell.indicatorOrder) && cell.indicatorOrder.length) {
        const known = cell.indicatorOrder.filter(id => id === 'break' || id === 'supervision' || id === 'lunch');
        const rest = ['break', 'supervision', 'lunch'].filter(id => !known.includes(id));
        return [...known, ...rest];
      }
      if (cell && cell.lunchBeforeBreak) return ['lunch', 'break', 'supervision'];
      const starts = {
        break: brk ? lessonEndMin : Infinity,
        supervision: effSupervision ? effSupervision.start : Infinity,
        lunch: effLunch ? effLunch.start : Infinity,
      };
      return ['break', 'supervision', 'lunch'].slice().sort((a, b) => starts[a] - starts[b]);
    }

    // =================== RENDER GRID HEADER ===================
    function renderGridHeader() {
      const headRow = document.getElementById('gridHeadRow');
      const isEdit = document.body.classList.contains('edit-mode');
      while (headRow.children.length > 1) headRow.removeChild(headRow.lastChild);
      for (let d = 0; d < 5; d++) {
        const th = document.createElement('th');
        if (isTodayColumn(d)) th.classList.add('day-today');
        if (!isEdit) {
          th.textContent = `${DAY_FULL[d]} (${rhythms[dayRhythms[d]].name || '?'})`;
          const capD = d;
          const clrBtn = document.createElement('button');
          clrBtn.textContent = '🗑';
          clrBtn.title = 'Tyhjennä koko päivä';
          clrBtn.style.cssText = 'margin-left:6px;background:none;border:none;cursor:pointer;opacity:0.45;font-size:0.85em;vertical-align:middle;';
          clrBtn.addEventListener('mouseover', () => clrBtn.style.opacity = '1');
          clrBtn.addEventListener('mouseout', () => clrBtn.style.opacity = '0.45');
          clrBtn.addEventListener('click', e => {
            e.stopPropagation();
            e.preventDefault();
            if (!confirm(`Tyhjennetäänkö kaikki ${DAY_FULL[capD]}-sarakkeen solut?`)) return;
            const key = getWeekKey(currentWeekOffset);
            if (!weekData[key]) weekData[key] = {};
            weekData[key][DAYS[capD]] = {};
            dirty = true; renderGrid();
          });
          th.appendChild(clrBtn);
        } else {
          const span = document.createElement('span');
          span.textContent = DAY_FULL[d];
          th.appendChild(span);
          const sel = document.createElement('select');
          sel.className = 'day-th-select';
          rhythms.forEach((r, ri) => {
            const opt = document.createElement('option');
            opt.value = String(ri);
            opt.textContent = r.name || `Rytmi ${ri + 1}`;
            if (dayRhythms[d] === ri) opt.selected = true;
            sel.appendChild(opt);
          });
          const capD = d;
          sel.addEventListener('change', () => { dayRhythms[capD] = parseInt(sel.value); renderGridHeader(); });
          th.appendChild(sel);
        }
        headRow.appendChild(th);
      }
    }

    // =================== RENDER GRID ===================
    function renderGrid() {
      renderGridHeader();
      const tbody = document.getElementById('gridBody');
      tbody.innerHTML = '';
      const key = getWeekKey(currentWeekOffset);
      const dayData = weekData[key] || {};

      for (let li = 0; li < LESSON_COUNT; li++) {
        const curLi = li;
        const tr = document.createElement('tr');

        const tc = document.createElement('td');
        tc.className = 'time-cell';
        tc.textContent = `T${li + 1}`;
        tr.appendChild(tc);

        for (let d = 0; d < 5; d++) {
          const td = document.createElement('td');
          td.className = 'lesson-cell';
          if (isTodayColumn(d)) td.classList.add('day-today');

          const timeDiv = document.createElement('div');
          const t = getCellTime(d, curLi, key);
          timeDiv.className = 'cell-time';
          const hasOverride = ((weekData[key] || {})[DAYS[d]] || {})[String(curLi)]?.startOverride != null;
          if (hasOverride) timeDiv.classList.add('time-overridden');
          timeDiv.textContent = minToTime(t.start) + '–' + minToTime(t.end);
          td.appendChild(timeDiv);

          const cell = (dayData[DAYS[d]] || {})[String(curLi)];
          if (cell && cell.subjects?.length) {
            const subRow = document.createElement('div');
            subRow.className = 'cell-subjects';
            for (const code of cell.subjects) {
              const s = subjects.find(x => x.code === code);
              const badge = document.createElement('span');
              badge.className = 'cell-subject-badge';
              badge.style.background = s ? s.color : '#9ca3af';
              badge.textContent = code;
              subRow.appendChild(badge);
            }
            td.appendChild(subRow);
          }

          if (cell && (cell.participants?.length || cell.text || cell.subjects?.length)) {
            td.classList.add('has-content');
            if (cell.participants?.length) {
              const pDiv = document.createElement('div');
              pDiv.className = 'cell-participants';
              pDiv.textContent = cell.participants.join(', ');
              td.appendChild(pDiv);
            }
            if (cell.text) {
              const tDiv = document.createElement('div');
              tDiv.className = 'cell-text';
              tDiv.textContent = cell.text;
              td.appendChild(tDiv);
            }
          }

          if (cell && cell.subjects?.length) {
            const primary = subjects.find(x => x.code === cell.subjects[0]);
            const primaryColor = primary ? primary.color : null;
            const bg = hexToRgba(primaryColor, 0.16);
            if (bg) {
              td.style.background = bg;
              td.style.boxShadow = `inset 3px 0 0 ${primaryColor}`;
              td.style.setProperty('--cell-tint', bg);
              td.style.setProperty('--cell-accent', primaryColor);
              td.classList.add('has-subject-color');
            }
          }

          const brk = (dayBreaks[d] || []).find(b => b.afterLesson === curLi);
          const effLunch = getEffectiveLunch(d, curLi, cell);
          const effSupervision = getEffectiveSupervision(cell, brk, t.end);

          const indicatorEls = {};
          if (brk) {
            const brkDiv = document.createElement('div');
            brkDiv.className = 'cell-break';
            brkDiv.textContent = `░ ${brk.duration} min ░`;
            indicatorEls.break = brkDiv;
          }
          if (effSupervision) {
            const sDiv = document.createElement('div');
            sDiv.className = 'cell-supervision';
            sDiv.textContent = `🏃 Välkkävalvonta ${minToTime(effSupervision.start)} (${effSupervision.duration}min)`;
            indicatorEls.supervision = sDiv;
          }
          if (effLunch) {
            const lDiv = document.createElement('div');
            lDiv.className = 'cell-lunch' + (effLunch.isDefault ? ' is-default' : '');
            lDiv.textContent = `🍽️ ${minToTime(effLunch.start)} (${effLunch.duration}min)`;
            indicatorEls.lunch = lDiv;
          }

          const order = getIndicatorOrder(cell, brk, effSupervision, effLunch, t.end);
          const presentOrder = order.filter(id => indicatorEls[id]);
          let i = 0;
          while (i < presentOrder.length) {
            const el = indicatorEls[presentOrder[i]];
            // Group consecutive indicators onto one row so e.g. the break and
            // supervision badges (or any two/three adjacent indicators) sit
            // side by side instead of stacking on separate lines.
            if (i + 1 < presentOrder.length) {
              const rowDiv = document.createElement('div');
              rowDiv.className = 'cell-indicator-row';
              rowDiv.appendChild(el);
              let j = i + 1;
              while (j < presentOrder.length) {
                rowDiv.appendChild(indicatorEls[presentOrder[j]]);
                j++;
              }
              td.appendChild(rowDiv);
              i = presentOrder.length;
            } else {
              td.appendChild(el);
              i++;
            }
          }

          td.addEventListener('click', () => openPopup(d, curLi));
          tr.appendChild(td);
        }
        tbody.appendChild(tr);
      }
    }

    // =================== HEADER ===================
    function updateHeader() {
      const { week, year, dates } = getWeekInfo(currentWeekOffset);
      const thisYear = new Date().getFullYear();
      const yearSuffix = year !== thisYear ? ' ' + year : '';
      document.getElementById('weekLabel').textContent =
        `Viikko ${week}  (${fmtDate(dates[0])} – ${fmtDate(dates[4])}${yearSuffix})`;
    }

    // =================== POPUP ===================
    function openPopup(dayIdx, slotIdx) {
      popupState = { dayIdx, slotIdx };
      const key = getWeekKey(currentWeekOffset);
      const cell = ((weekData[key] || {})[DAYS[dayIdx]] || {})[String(slotIdx)] || { participants: [], text: '' };
      popupParticipants = [...(cell.participants || [])];
      popupSubjects = [...(cell.subjects || [])];

      const t = getCellTime(dayIdx, slotIdx, key);
      document.getElementById('popupTitle').textContent =
        `${DAY_FULL[dayIdx]}  T${slotIdx + 1}`;

      document.getElementById('popupStartTime').value = minToTime(t.start);
      document.getElementById('popupEndTime').value = minToTime(t.end);
      const timeRow = document.getElementById('popupTimeRow');
      if (cell.startOverride != null) timeRow.classList.add('has-override');
      else timeRow.classList.remove('has-override');

      document.getElementById('popupText').value = cell.text || '';
      const effLunch = getEffectiveLunch(dayIdx, slotIdx, cell);
      document.getElementById('lunchStartInput').value = effLunch ? minToTime(effLunch.start) : '';
      document.getElementById('lunchDuration').value = String(effLunch ? effLunch.duration : 15);
      const lunchLabel = document.getElementById('lunchLabel');
      lunchLabel.textContent = effLunch && effLunch.isDefault ? '🍽️ Ruokailu alkaa (oletus)' : '🍽️ Ruokailu alkaa';
      const brkForPopup = (dayBreaks[dayIdx] || []).find(b => b.afterLesson === slotIdx);
      const effSupervision = getEffectiveSupervision(cell, brkForPopup, t.end);
      const supBtn = document.getElementById('supervisionBtn');
      supBtn.style.background = cell.breakSupervision ? '#dbeafe' : 'white';
      supBtn.style.borderColor = cell.breakSupervision ? '#3b82f6' : '#d1d5db';
      supBtn.style.color = cell.breakSupervision ? '#1d4ed8' : '';
      supBtn.style.fontWeight = cell.breakSupervision ? '600' : '';
      supBtn.dataset.active = cell.breakSupervision ? '1' : '0';
      const supStartInput = document.getElementById('supervisionStartInput');
      const supDurationSelect = document.getElementById('supervisionDuration');
      supStartInput.style.display = cell.breakSupervision ? '' : 'none';
      supDurationSelect.style.display = cell.breakSupervision ? '' : 'none';
      supStartInput.value = effSupervision ? minToTime(effSupervision.start) : '';
      supDurationSelect.value = String(effSupervision ? effSupervision.duration : 15);
      popupIndicatorOrder = getIndicatorOrder(cell, brkForPopup, effSupervision, effLunch, t.end);
      popupIndicatorOrderChanged = false;
      renderIndicatorOrder();
      renderPopupParticipants();
      renderPopupSubjects();
      document.getElementById('popupOverlay').classList.add('open');
      document.getElementById('popupText').focus();
    }

    function renderIndicatorOrder() {
      const container = document.getElementById('indicatorOrderList');
      container.innerHTML = '';
      popupIndicatorOrder.forEach((id, i) => {
        const row = document.createElement('div');
        row.style.cssText = 'display:flex;align-items:center;gap:6px;background:#f9fafb;border:1px solid #e5e7eb;border-radius:4px;padding:3px 8px;font-size:0.82em;';
        const label = document.createElement('span');
        label.style.flex = '1';
        label.textContent = INDICATOR_ORDER_LABELS[id];
        row.appendChild(label);
        const upBtn = document.createElement('button');
        upBtn.type = 'button';
        upBtn.textContent = '↑';
        upBtn.disabled = i === 0;
        upBtn.style.cssText = 'padding:1px 7px;cursor:pointer;';
        upBtn.addEventListener('click', () => moveIndicatorOrder(i, -1));
        row.appendChild(upBtn);
        const downBtn = document.createElement('button');
        downBtn.type = 'button';
        downBtn.textContent = '↓';
        downBtn.disabled = i === popupIndicatorOrder.length - 1;
        downBtn.style.cssText = 'padding:1px 7px;cursor:pointer;';
        downBtn.addEventListener('click', () => moveIndicatorOrder(i, 1));
        row.appendChild(downBtn);
        container.appendChild(row);
      });
    }

    function moveIndicatorOrder(index, delta) {
      const target = index + delta;
      if (target < 0 || target >= popupIndicatorOrder.length) return;
      const arr = popupIndicatorOrder;
      [arr[index], arr[target]] = [arr[target], arr[index]];
      popupIndicatorOrderChanged = true;
      renderIndicatorOrder();
    }

    function hidePopupOverlay() {
      popupState = null;
      popupParticipants = [];
      popupSubjects = [];
      document.getElementById('popupOverlay').classList.remove('open');
    }

    function cancelPopup() {
      if (!popupState) return;
      hidePopupOverlay();
    }

    function savePopup() {
      if (!popupState) return;
      const { dayIdx, slotIdx } = popupState;
      const key = getWeekKey(currentWeekOffset);
      const text = document.getElementById('popupText').value;

      const startVal = document.getElementById('popupStartTime').value;
      const endVal = document.getElementById('popupEndTime').value;
      const computed = computeCascadingSlotTime(dayIdx, slotIdx, key);
      const startMin = parseInt(startVal.split(':')[0]) * 60 + parseInt(startVal.split(':')[1]);
      const endMin = parseInt(endVal.split(':')[0]) * 60 + parseInt(endVal.split(':')[1]);
      const hasOverride = startMin !== computed.start || endMin !== computed.end;

      if (!weekData[key]) weekData[key] = {};
      if (!weekData[key][DAYS[dayIdx]]) weekData[key][DAYS[dayIdx]] = {};
      const slotData = { participants: [...popupParticipants], text, subjects: [...popupSubjects] };
      if (hasOverride) { slotData.startOverride = startMin; slotData.endOverride = endMin; }
      const lunchVal = document.getElementById('lunchStartInput').value;
      if (lunchVal) {
        const lp = lunchVal.split(':');
        slotData.lunchStart = parseInt(lp[0]) * 60 + parseInt(lp[1]);
        slotData.lunchDuration = parseInt(document.getElementById('lunchDuration').value);
      } else {
        const dl = dayLunch[dayIdx];
        if (dl && dl.slot === slotIdx) slotData.lunchCleared = true;
      }
      if (document.getElementById('supervisionBtn').dataset.active === '1') {
        slotData.breakSupervision = true;
        const supVal = document.getElementById('supervisionStartInput').value;
        if (supVal) {
          const sp = supVal.split(':');
          slotData.supervisionStart = parseInt(sp[0]) * 60 + parseInt(sp[1]);
          slotData.supervisionDuration = parseInt(document.getElementById('supervisionDuration').value);
        }
      }
      if (popupIndicatorOrderChanged) slotData.indicatorOrder = [...popupIndicatorOrder];
      weekData[key][DAYS[dayIdx]][String(slotIdx)] = slotData;
      dirty = true;
      renderGrid();

      const feedback = document.getElementById('popupSaveFeedback');
      feedback.textContent = '✓ Tallennettu';
      setTimeout(() => {
        feedback.textContent = '';
        hidePopupOverlay();
      }, 900);
    }


    function renderPopupParticipants() {
      const container = document.getElementById('popupParticipants');
      container.innerHTML = '';

      // Selected participants as removable chips
      if (popupParticipants.length) {
        const row = document.createElement('div');
        row.className = 'popup-selected-row';
        for (const m of [...popupParticipants]) {
          const chip = document.createElement('button');
          chip.className = 'popup-selected-chip';
          chip.textContent = m + ' ✕';
          const capM = m;
          chip.addEventListener('click', () => {
            const idx = popupParticipants.indexOf(capM);
            if (idx >= 0) popupParticipants.splice(idx, 1);
            renderPopupParticipants();
          });
          row.appendChild(chip);
        }
        container.appendChild(row);
      }

      // Free-text add row
      const addRow = document.createElement('div');
      addRow.className = 'popup-add-row';
      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'popup-add-input';
      input.placeholder = 'Lisää osallistuja...';
      const addBtn = document.createElement('button');
      addBtn.className = 'popup-add-btn';
      addBtn.textContent = '+';
      const doAdd = () => {
        const val = input.value.trim();
        if (val && !popupParticipants.includes(val)) {
          popupParticipants.push(val);
          renderPopupParticipants();
        } else {
          input.value = '';
        }
      };
      addBtn.addEventListener('click', doAdd);
      input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); doAdd(); } });
      addRow.appendChild(input);
      addRow.appendChild(addBtn);
      container.appendChild(addRow);

      if (!registry.length) {
        const em = document.createElement('em');
        em.style.cssText = 'color:#9ca3af;font-size:0.82em';
        em.textContent = 'Rekisteri tyhjä – lisää ryhmiä muokkaustilassa.';
        container.appendChild(em);
        return;
      }

      const allRow = document.createElement('div');
      allRow.className = 'popup-select-all-row';
      const allBtn = document.createElement('button');
      allBtn.className = 'popup-quick-btn popup-select-all-btn';
      allBtn.textContent = 'Valitse kaikki ryhmät →';
      allBtn.addEventListener('click', () => {
        for (const group of registry) {
          for (const m of group.members) {
            if (m.trim() && !popupParticipants.includes(m)) popupParticipants.push(m);
          }
        }
        renderPopupParticipants();
      });
      allRow.appendChild(allBtn);
      container.appendChild(allRow);

      for (const group of registry) {
        const gdiv = document.createElement('div');
        gdiv.className = 'popup-group';

        const ghdr = document.createElement('div');
        ghdr.className = 'popup-group-header';

        const gname = document.createElement('span');
        gname.textContent = group.name || '(ryhmä)';
        ghdr.appendChild(gname);

        const qBtn = document.createElement('button');
        qBtn.className = 'popup-quick-btn';
        qBtn.textContent = 'Valitse kaikki →';
        const cap = group;
        qBtn.addEventListener('click', () => {
          const newM = cap.members.filter(m => m.trim());
          for (const m of newM) { if (!popupParticipants.includes(m)) popupParticipants.push(m); }
          renderPopupParticipants();
        });
        ghdr.appendChild(qBtn);
        gdiv.appendChild(ghdr);

        const mems = document.createElement('div');
        mems.className = 'popup-members';
        for (const m of group.members) {
          if (!m.trim()) continue;
          const btn = document.createElement('button');
          btn.className = 'popup-member-btn' + (popupParticipants.includes(m) ? ' selected' : '');
          btn.textContent = m;
          const capM = m;
          btn.addEventListener('click', () => {
            const idx = popupParticipants.indexOf(capM);
            if (idx >= 0) popupParticipants.splice(idx, 1);
            else popupParticipants.push(capM);
            renderPopupParticipants();
          });
          mems.appendChild(btn);
        }
        gdiv.appendChild(mems);
        container.appendChild(gdiv);
      }
    }

    // =================== REGISTRY RENDER ===================
    function renderRegistry() {
      const container = document.getElementById('registryGroups');
      container.innerHTML = '';
      registry.forEach((group, gi) => {
        const gdiv = document.createElement('div');
        gdiv.className = 'reg-group';

        const ghdr = document.createElement('div');
        ghdr.className = 'reg-group-header';

        const nameIn = document.createElement('input');
        nameIn.className = 'group-name-input';
        nameIn.value = group.name;
        nameIn.placeholder = 'Ryhmän nimi';
        nameIn.addEventListener('input', () => { group.name = nameIn.value; });
        ghdr.appendChild(nameIn);

        const delG = document.createElement('button');
        delG.className = 'del-btn';
        delG.title = 'Poista ryhmä';
        delG.textContent = '🗑';
        delG.addEventListener('click', () => { registry.splice(gi, 1); renderRegistry(); });

        const upBtn = document.createElement('button');
        upBtn.className = 'reorder-btn';
        upBtn.textContent = '↑';
        upBtn.disabled = gi === 0;
        upBtn.addEventListener('click', () => {
          [registry[gi - 1], registry[gi]] = [registry[gi], registry[gi - 1]];
          renderRegistry();
        });

        const downBtn = document.createElement('button');
        downBtn.className = 'reorder-btn';
        downBtn.textContent = '↓';
        downBtn.disabled = gi === registry.length - 1;
        downBtn.addEventListener('click', () => {
          [registry[gi], registry[gi + 1]] = [registry[gi + 1], registry[gi]];
          renderRegistry();
        });

        ghdr.appendChild(upBtn);
        ghdr.appendChild(downBtn);
        ghdr.appendChild(delG);

        const mems = document.createElement('div');

          const inp = document.createElement('input');

          inp.value = m;
          inp.placeholder = 'Nimi';
          inp.addEventListener('input', () => { group.members[mi] = inp.value; });
          item.appendChild(inp);

          const delM = document.createElement('button');
          delM.className = 'del-btn';
          delM.textContent = '×';

          mems.appendChild(item);

        const addM = document.createElement('button');
        addM.className = 'add-member-btn';
        addM.textContent = '+ Lisää nimi';

        mems.appendChild(addM);

        gdiv.appendChild(mems);
        container.appendChild(gdiv);
      });
    }

    // =================== RHYTHMS RENDER ===================
    function renderRhythms() {
      const container = document.getElementById('rhythmsGroups');
      container.innerHTML = '';
      rhythms.forEach((r, ri) => {
        const row = document.createElement('div');
        row.className = 'rhythm-row';

        const nameIn = document.createElement('input');
        nameIn.className = 'rhythm-name-input';
        nameIn.value = r.name;
        nameIn.placeholder = 'Nimi';
        nameIn.addEventListener('input', () => { r.name = nameIn.value; renderGridHeader(); });
        row.appendChild(nameIn);

        const timeIn = document.createElement('input');
        timeIn.type = 'time';
        timeIn.className = 'rhythm-time-input';
        timeIn.value = minToTime(r.startMinutes);
        timeIn.addEventListener('change', () => {
          const parts = timeIn.value.split(':');
          r.startMinutes = parseInt(parts[0]) * 60 + parseInt(parts[1]);
          renderGrid();
        });
        row.appendChild(timeIn);

        const lbl = document.createElement('span');
        lbl.style.cssText = 'font-size:0.8em;color:#6b7280;';
        lbl.textContent = '(aloitusaika)';
        row.appendChild(lbl);

        const delBtn = document.createElement('button');
        delBtn.className = 'del-btn';
        delBtn.textContent = '🗑';
        delBtn.title = 'Poista rytmi';
        delBtn.addEventListener('click', () => {
          if (rhythms.length <= 1) { alert('Vähintään yksi rytmi tarvitaan.'); return; }
          rhythms.splice(ri, 1);
          dayRhythms = dayRhythms.map(d => {
            if (d === ri) return 0;
            if (d > ri) return d - 1;
            return d;
          });
          renderRhythms();
          renderGrid();
        });
        row.appendChild(delBtn);

        container.appendChild(row);
      });
    }

    // =================== SUBJECTS RENDER ===================
    function renderSubjectsSection() {
      const container = document.getElementById('subjectsGroups');
      container.innerHTML = '';
      subjects.forEach((s, si) => {
        const row = document.createElement('div');
        row.className = 'subject-row';

        const codeIn = document.createElement('input');
        codeIn.className = 'subject-code-input';
        codeIn.value = s.code;
        codeIn.placeholder = 'KOO';
        codeIn.maxLength = 10;
        codeIn.addEventListener('change', () => {
          const normalized = normalizeCode(codeIn.value);
          if (!normalized) { codeIn.value = s.code; return; }
          if (subjects.some((x, xi) => xi !== si && x.code === normalized)) {
            codeIn.style.borderColor = '#dc2626'; codeIn.value = s.code;
            setTimeout(() => { codeIn.style.borderColor = ''; }, 1500);
            return;
          }
          const oldCode = s.code;
          for (const wk of Object.keys(weekData)) {
            for (const day of Object.keys(weekData[wk])) {
              for (const slot of Object.keys(weekData[wk][day])) {
                const cell = weekData[wk][day][slot];
                if (Array.isArray(cell.subjects)) cell.subjects = cell.subjects.map(c => c === oldCode ? normalized : c);
              }
            }
          }
          s.code = normalized; codeIn.value = normalized;
          saveSubjects(); renderGrid();
        });
        row.appendChild(codeIn);

        const nameIn = document.createElement('input');
        nameIn.className = 'subject-name-input';
        nameIn.value = s.name;
        nameIn.placeholder = 'Aineen nimi';
        nameIn.addEventListener('input', () => { s.name = nameIn.value; saveSubjects(); });
        row.appendChild(nameIn);

        const colorIn = document.createElement('input');
        colorIn.type = 'color';
        colorIn.className = 'subject-color-input';
        colorIn.value = s.color;
        colorIn.addEventListener('input', () => { s.color = colorIn.value; saveSubjects(); renderGrid(); });
        row.appendChild(colorIn);

        const upBtn = document.createElement('button');
        upBtn.className = 'reorder-btn'; upBtn.textContent = '↑'; upBtn.disabled = si === 0;
        upBtn.addEventListener('click', () => {
          [subjects[si - 1], subjects[si]] = [subjects[si], subjects[si - 1]];
          saveSubjects(); renderSubjectsSection();
        });
        row.appendChild(upBtn);

        const downBtn = document.createElement('button');
        downBtn.className = 'reorder-btn'; downBtn.textContent = '↓'; downBtn.disabled = si === subjects.length - 1;
        downBtn.addEventListener('click', () => {
          [subjects[si], subjects[si + 1]] = [subjects[si + 1], subjects[si]];
          saveSubjects(); renderSubjectsSection();
        });
        row.appendChild(downBtn);

        const delBtn = document.createElement('button');
        delBtn.className = 'del-btn'; delBtn.textContent = '🗑';
        delBtn.addEventListener('click', () => {
          subjects.splice(si, 1);
          saveSubjects(); renderSubjectsSection(); renderGrid();
        });
        row.appendChild(delBtn);

        container.appendChild(row);
      });
    }

    function renderPopupSubjects() {
      const container = document.getElementById('popupSubjects');
      container.innerHTML = '';

      const lbl = document.createElement('div');
      lbl.className = 'popup-subjects-label';
      lbl.textContent = 'Oppiaine';
      container.appendChild(lbl);

      if (popupSubjects.length) {
        const chipsRow = document.createElement('div');
        chipsRow.className = 'popup-subjects-chips';
        for (const code of [...popupSubjects]) {
          const s = subjects.find(x => x.code === code);
          const chip = document.createElement('button');
          chip.className = 'popup-subject-chip';
          chip.style.background = s ? s.color : '#9ca3af';
          chip.textContent = code + ' ✕';
          const capCode = code;
          chip.addEventListener('click', () => {
            const idx = popupSubjects.indexOf(capCode);
            if (idx >= 0) popupSubjects.splice(idx, 1);
            renderPopupSubjects();
          });
          chipsRow.appendChild(chip);
        }
        container.appendChild(chipsRow);
      }

      if (subjects.length) {
        const regRow = document.createElement('div');
        regRow.className = 'popup-subjects-registry';
        for (const s of subjects) {
          const btn = document.createElement('button');
          const selected = popupSubjects.includes(s.code);
          btn.className = 'popup-subject-btn' + (selected ? ' selected' : '');
          if (selected) btn.style.background = s.color;
          btn.textContent = s.code;
          btn.title = s.name || s.code;
          const capCode = s.code;
          btn.addEventListener('click', () => {
            const idx = popupSubjects.indexOf(capCode);
            if (idx >= 0) popupSubjects.splice(idx, 1);
            else popupSubjects.push(capCode);
            renderPopupSubjects();
          });
          regRow.appendChild(btn);
        }
        container.appendChild(regRow);
      }

      const addRow = document.createElement('div');
      addRow.className = 'popup-add-row';
      const input = document.createElement('input');
      input.type = 'text'; input.className = 'popup-add-input';
      input.placeholder = 'Uusi tunnus...'; input.maxLength = 10;
      const addBtn = document.createElement('button');
      addBtn.className = 'popup-add-btn'; addBtn.textContent = '+';
      const doAdd = () => {
        const val = normalizeCode(input.value);
        if (!val) return;
        if (!subjects.find(x => x.code === val)) {
          subjects.push({ code: val, name: '', color: '#9ca3af' });
          saveSubjects();
        }
        if (!popupSubjects.includes(val)) popupSubjects.push(val);
        input.value = '';
        renderPopupSubjects();
      };
      addBtn.addEventListener('click', doAdd);
      input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); doAdd(); } });
      addRow.appendChild(input); addRow.appendChild(addBtn);
      container.appendChild(addRow);
    }

    // =================== BREAKS EDITOR ===================
    function performCopy(src, targets) {
      const key = getWeekKey(currentWeekOffset);
      undoState = {
        weekKey: key,
        affected: targets.map(tgt => ({
          dayIdx: tgt,
          breaks: JSON.parse(JSON.stringify(dayBreaks[tgt] || [])),
          lunch: dayLunch[tgt] ? { ...dayLunch[tgt] } : null,
          rhythm: dayRhythms[tgt],
          cells: JSON.parse(JSON.stringify((weekData[key] || {})[DAYS[tgt]] || {}))
        }))
      };
      const srcCells = JSON.parse(JSON.stringify((weekData[key] || {})[DAYS[src]] || {}));
      for (const tgt of targets) {
        dayBreaks[tgt] = JSON.parse(JSON.stringify(dayBreaks[src] || []));
        dayLunch[tgt] = dayLunch[src] ? { ...dayLunch[src] } : null;
        dayRhythms[tgt] = dayRhythms[src];
        if (!weekData[key]) weekData[key] = {};
        weekData[key][DAYS[tgt]] = JSON.parse(JSON.stringify(srcCells));
      }
      dirty = true;
      renderBreaksEditor(); renderGrid();
    }
