<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClassPlanner – Viikkosuunnitelma</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; background: #f0f2f5; color: #1a1a1a; }

    /* ---- TOOLBAR ---- */
    #toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: #1e3a5f;
      color: white;
      gap: 12px;
      flex-wrap: wrap;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .toolbar-left h1 { font-size: 1.05em; font-weight: 700; letter-spacing: -0.3px; }
    .toolbar-center { display: flex; align-items: center; gap: 10px; font-size: 0.9em; font-weight: 500; }
    .toolbar-right { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    #toolbar button {
      background: rgba(255,255,255,0.12);
      color: white;
      border: 1px solid rgba(255,255,255,0.25);
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.82em;
      transition: background 0.15s;
    }
    #toolbar button:hover { background: rgba(255,255,255,0.22); }
    body.edit-mode #editToggle { background: #f59e0b; color: #1a1a1a; border-color: #d97706; font-weight: 600; }
    #folderName { font-size: 0.78em; opacity: 0.7; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* ---- MAIN ---- */
    main { padding: 16px; max-width: 1400px; margin: 0 auto; }

    /* ---- GRID TABLE ---- */
    #grid {
      width: 100%;
      table-layout: fixed;
      border-collapse: collapse;
      background: white;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
      border-radius: 6px;
      overflow: hidden;
    }
    #grid th, #grid td { border: 1px solid #d1d5db; vertical-align: top; }
    #grid thead th {
      background: #2c5282;
      color: white;
      padding: 8px 10px;
      font-size: 0.88em;
      text-align: center;
      font-weight: 600;
    }
    #grid thead th:first-child { width: 76px; }

    .time-cell {
      padding: 5px 7px;
      font-size: 0.85em;
      font-weight: 700;
      color: #374151;
      width: 76px;
      text-align: center;
      vertical-align: middle;
      background: #fafafa;
    }

    .lesson-cell {
      height: auto;
      min-height: 40px;
      padding: 5px 7px;
      cursor: pointer;
      transition: background 0.1s;
      word-wrap: break-word;
      overflow-wrap: break-word;
    }
    .lesson-cell:hover { background: #eff6ff; }
    .lesson-cell.has-content { background: #fefce8; }
    .lesson-cell.has-content:hover { background: #fef9c3; }
    .cell-time { font-size: 0.72em; color: #6b7280; margin-bottom: 2px; }
    .cell-participants { font-size: 0.72em; color: #6b7280; margin-bottom: 2px; font-style: italic; }

    .cell-text { font-size: 0.82em; line-height: 1.35; color: #374151; white-space: pre-wrap; }
    .cell-break { font-size: 0.7em; color: #9ca3af; text-align: center; padding: 3px 0 2px; border-top: 1px dashed #e5e7eb; margin-top: 4px; }
    .cell-lunch-break { font-size: 0.72em; color: #92400e; background: #fef3c7; border-radius: 3px; padding: 2px 5px; margin-top: 4px; display: inline-block; }
    .break-entry-lunch {
      display: inline-flex; align-items: center; gap: 2px;
      background: #fffbeb; border: 1px solid #fcd34d; border-radius: 4px;
      padding: 2px 4px; font-size: 0.78em;
    }
    .break-lunch-btn {
      background: none; border: 1px dashed #d97706; color: #92400e;
      border-radius: 4px; cursor: pointer; padding: 0px 5px; font-size: 0.78em; line-height: 1.6;
    }
    .break-lunch-btn:hover { background: #fef3c7; }
    .cell-lunch { font-size: 0.72em; color: #b45309; background: #fef3c7; border-radius: 3px; padding: 2px 5px; margin-top: 4px; display: inline-block; }
    .cell-supervision { font-size: 0.72em; color: #1d4ed8; background: #dbeafe; border-radius: 3px; padding: 2px 5px; margin-top: 4px; display: inline-block; }
    .popup-lunch-row {
      display: flex; align-items: center; gap: 8px; padding: 8px 15px;
      border-top: 1px solid #e5e7eb; flex-shrink: 0; background: #fffbeb; flex-wrap: wrap;
    }
    .popup-lunch-row label { font-size: 0.82em; color: #92400e; }
    .lunch-time-input { border: 1px solid #fcd34d; border-radius: 4px; padding: 3px 6px; font-size: 0.85em; outline: none; width: 100px; }
    .lunch-time-input:focus { border-color: #d97706; }
    .lunch-dur-select { border: 1px solid #fcd34d; border-radius: 4px; padding: 3px 6px; font-size: 0.82em; outline: none; }
    #clearLunchBtn { background: none; border: none; color: #92400e; cursor: pointer; font-size: 0.78em; text-decoration: underline; padding: 0; }
    .cell-time.time-overridden { color: #d97706; font-weight: 600; }

    /* ---- BREAKS SECTION ---- */
    #breaksSection {
      display: none;
      margin-top: 18px;
      background: white;
      border-radius: 6px;
      padding: 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }
    body.edit-mode #breaksSection { display: block; }
    #breaksSection h2 { font-size: 0.95em; font-weight: 600; margin-bottom: 12px; color: #374151; }
    .breaks-day-row { display: flex; align-items: center; gap: 5px; margin-bottom: 10px; flex-wrap: wrap; }
    .breaks-day-label { font-weight: 600; font-size: 0.82em; color: #374151; min-width: 90px; flex-shrink: 0; }
    .break-slot-label { font-size: 0.75em; color: #9ca3af; padding: 0 2px; }
    .break-add-btn {
      background: none; border: 1px dashed #9ca3af; color: #6b7280;
      border-radius: 4px; cursor: pointer; padding: 0px 5px; font-size: 0.78em; line-height: 1.6;
    }
    .break-add-btn:hover { border-color: #3b82f6; color: #3b82f6; }
    .break-entry {
      display: inline-flex; align-items: center; gap: 2px;
      background: #f0fdf4; border: 1px solid #86efac; border-radius: 4px;
      padding: 2px 4px; font-size: 0.78em;
    }
    .break-dur-dec, .break-dur-inc {
      background: white; border: 1px solid #d1d5db; border-radius: 2px;
      cursor: pointer; width: 18px; height: 18px; font-size: 0.85em;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .break-dur-dec:hover, .break-dur-inc:hover { background: #e5e7eb; }
    .break-del-entry { background: none; border: none; cursor: pointer; color: #9ca3af; font-size: 1em; padding: 0 1px; }
    .break-del-entry:hover { color: #dc2626; }

    /* ---- POPUP TIME ---- */
    .popup-time-row {
      display: flex; align-items: center; gap: 8px; padding: 8px 15px;
      border-bottom: 1px solid #e5e7eb; flex-shrink: 0; background: white;
    }
    .popup-time-row.has-override { background: #fffbeb; }
    .popup-time-row label { font-size: 0.82em; color: #6b7280; }
    .popup-time-input { border: 1px solid #e5e7eb; border-radius: 4px; padding: 3px 6px; font-size: 0.85em; outline: none; width: 90px; }
    .popup-time-input:focus { border-color: #3b82f6; }
    #popupResetTime { background: none; border: none; color: #6b7280; cursor: pointer; font-size: 0.78em; padding: 2px 6px; margin-left: auto; }
    #popupResetTime:hover { color: #3b82f6; text-decoration: underline; }
    .popup-copy-row {
      display: flex; align-items: center; gap: 8px; padding: 8px 15px;
      border-top: 1px solid #e5e7eb; flex-shrink: 0; background: #f9fafb;
      flex-wrap: wrap;
    }
    .popup-copy-row label { font-size: 0.82em; color: #6b7280; }
    .popup-copy-select { border: 1px solid #e5e7eb; border-radius: 4px; padding: 3px 6px; font-size: 0.82em; outline: none; }
    .popup-copy-select:focus { border-color: #3b82f6; }
    #copySlotBtn { background: none; border: 1px solid #3b82f6; color: #3b82f6; border-radius: 4px; cursor: pointer; font-size: 0.78em; padding: 3px 8px; }
    #copySlotBtn:hover { background: #eff6ff; }
    #copySlotFeedback { font-size: 0.78em; color: #16a34a; }
    .copy-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; padding-top: 8px; border-top: 1px dashed #e5e7eb; flex-wrap: wrap; }
    .copy-row label { font-size: 0.82em; color: #6b7280; }
    .copy-day-select { border: 1px solid #e5e7eb; border-radius: 4px; padding: 3px 6px; font-size: 0.82em; outline: none; }
    .copy-day-btn { background: none; border: 1px solid #3b82f6; color: #3b82f6; border-radius: 4px; cursor: pointer; font-size: 0.78em; padding: 3px 8px; }
    .copy-day-btn:hover { background: #eff6ff; }
    .copy-all-btn { background: none; border: 1px solid #7c3aed; color: #7c3aed; border-radius: 4px; cursor: pointer; font-size: 0.78em; padding: 3px 8px; }
    .copy-all-btn:hover { background: #ede9fe; }
    .undo-copy-btn { background: none; border: none; color: #3b82f6; cursor: pointer; font-size: 0.78em; text-decoration: underline; padding: 0 4px; }
    #copyDayFeedback { font-size: 0.78em; color: #16a34a; }

    /* ---- REGISTRY SECTION ---- */
    #registrySection {
      display: none;
      margin-top: 18px;
      background: white;
      border-radius: 6px;
      padding: 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }
    body.edit-mode #registrySection { display: block; }
    #registrySection h2 { font-size: 0.95em; font-weight: 600; margin-bottom: 12px; color: #374151; }

    .reg-group { border: 1px solid #e5e7eb; border-radius: 6px; margin-bottom: 10px; overflow: hidden; }
    .reg-group-header { display: flex; align-items: center; gap: 8px; background: #f9fafb; padding: 6px 10px; }
    .reorder-btn { background: none; border: 1px solid #d1d5db; border-radius: 3px; cursor: pointer; font-size: 0.75em; padding: 1px 5px; color: #6b7280; line-height: 1.4; }
    .reorder-btn:hover { border-color: #3b82f6; color: #3b82f6; }
    .reorder-btn:disabled { opacity: 0.25; cursor: default; border-color: #e5e7eb; color: #d1d5db; }
    .group-name-input {
      border: none; background: transparent; font-weight: 600; font-size: 0.9em;
      flex: 1; outline: none; color: #1f2937;
    }
    .group-name-input:focus { border-bottom: 1px solid #3b82f6; }
    .reg-group-members { padding: 8px 10px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .member-item {
      display: flex; align-items: center; gap: 3px;
      background: #eff6ff; border: 1px solid #bfdbfe;
      border-radius: 4px; padding: 2px 4px 2px 8px; font-size: 0.82em;
    }
    .member-name-input { border: none; background: transparent; width: 88px; outline: none; font-size: 0.9em; }
    .del-btn { background: none; border: none; cursor: pointer; color: #9ca3af; font-size: 1em; padding: 0 2px; line-height: 1; }
    .del-btn:hover { color: #dc2626; }
    .add-member-btn, #addGroupBtn {
      background: none; border: 1px dashed #9ca3af; color: #6b7280;
      border-radius: 4px; cursor: pointer; padding: 3px 8px; font-size: 0.78em;
    }
    .add-member-btn:hover, #addGroupBtn:hover { border-color: #3b82f6; color: #3b82f6; }
    #addGroupBtn { display: inline-block; margin-top: 8px; }

    /* ---- RHYTHMS SECTION ---- */
    #rhythmsSection {
      display: none;
      margin-top: 18px;
      background: white;
      border-radius: 6px;
      padding: 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }
    body.edit-mode #rhythmsSection { display: block; }
    #rhythmsSection h2 { font-size: 0.95em; font-weight: 600; margin-bottom: 12px; color: #374151; }
    .rhythm-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .rhythm-name-input {
      border: 1px solid #e5e7eb; border-radius: 4px; padding: 3px 8px;
      width: 60px; font-size: 0.9em; font-weight: 600; outline: none; color: #1f2937;
    }
    .rhythm-name-input:focus { border-color: #3b82f6; }
    .rhythm-time-input { border: 1px solid #e5e7eb; border-radius: 4px; padding: 3px 6px; font-size: 0.85em; outline: none; }
    .rhythm-time-input:focus { border-color: #3b82f6; }
    #addRhythmBtn {
      background: none; border: 1px dashed #9ca3af; color: #6b7280;
      border-radius: 4px; cursor: pointer; padding: 3px 8px; font-size: 0.78em; margin-top: 4px;
    }
    #addRhythmBtn:hover { border-color: #3b82f6; color: #3b82f6; }
    .day-th-select {
      font-size: 0.78em; background: rgba(255,255,255,0.15); color: white;
      border: 1px solid rgba(255,255,255,0.3); border-radius: 3px; padding: 1px 4px; margin-left: 3px;
    }

    /* ---- POPUP ---- */
    #popupOverlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }
    #popupOverlay.open { display: flex; }
    #popup {
      background: white;
      border-radius: 8px;
      width: 440px;
      max-width: 95vw;
      max-height: 88vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 12px 40px rgba(0,0,0,0.22);
      overflow: hidden;
    }
    #popupHeader {
      display: flex; align-items: center; justify-content: space-between;
      padding: 11px 15px; background: #2c5282; color: white; flex-shrink: 0;
    }
    #popupTitle { font-weight: 600; font-size: 0.9em; }
    #popupClose { background: none; border: none; color: white; cursor: pointer; font-size: 1.1em; padding: 2px 5px; border-radius: 3px; }
    #popupClose:hover { background: rgba(255,255,255,0.15); }
    #popupParticipants { padding: 12px 15px; overflow-y: auto; max-height: 210px; border-bottom: 1px solid #e5e7eb; flex-shrink: 0; }
    .popup-group { margin-bottom: 10px; }
    .popup-group:last-child { margin-bottom: 0; }
    .popup-group-header { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; font-weight: 600; font-size: 0.82em; color: #374151; }
    .popup-quick-btn {
      background: none; border: 1px solid #3b82f6; color: #3b82f6;
      border-radius: 3px; cursor: pointer; font-size: 0.72em; padding: 1px 6px;
    }
    .popup-quick-btn:hover { background: #eff6ff; }
    .popup-members { display: flex; flex-wrap: wrap; gap: 5px; }
    .popup-member-btn {
      padding: 3px 10px; border-radius: 4px; border: 1px solid #d1d5db;
      background: white; cursor: pointer; font-size: 0.82em; transition: all 0.1s;
    }
    .popup-member-btn:hover { border-color: #3b82f6; color: #3b82f6; }
    .popup-member-btn.selected { background: #3b82f6; color: white; border-color: #3b82f6; }
    .popup-selected-row { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
    .popup-selected-chip { padding: 3px 8px; border-radius: 4px; background: #3b82f6; color: white; border: none; cursor: pointer; font-size: 0.82em; display: flex; align-items: center; gap: 4px; }
    .popup-selected-chip:hover { background: #2563eb; }
    .popup-add-row { display: flex; gap: 5px; margin-bottom: 8px; }
    .popup-add-input { flex: 1; border: 1px solid #d1d5db; border-radius: 4px; padding: 3px 8px; font-size: 0.82em; font-family: inherit; }
    .popup-add-input:focus { outline: none; border-color: #3b82f6; }
    .popup-add-btn { background: #3b82f6; color: white; border: none; border-radius: 4px; padding: 3px 10px; cursor: pointer; font-size: 0.82em; }
    .popup-add-btn:hover { background: #2563eb; }
    #popupText {
      padding: 12px 15px; border: none; outline: none;
      resize: vertical; min-height: 110px; font-size: 0.88em;
      font-family: inherit; line-height: 1.5; background: #fafafa; flex-shrink: 0;
    }

    /* ---- PRINT ---- */
    /* ---- NOTES & TODOS ---- */
    #notesArea { max-width: 1400px; margin: 16px auto 0; padding: 0 16px 24px; }
    .notes-row { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
    .notes-panel { flex: 1; min-width: 300px; background: white; border-radius: 6px; padding: 14px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
    .todo-panel { width: 300px; background: white; border-radius: 6px; padding: 14px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
    .notes-header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; font-weight: 600; font-size: 0.9em; color: #374151; }
    .notes-header span { flex: 1; }
    .notes-color-btns { display: flex; gap: 4px; }
    .color-btn { width: 18px; height: 18px; border-radius: 50%; border: 1px solid #d1d5db; cursor: pointer; padding: 0; }
    .color-btn:hover { border-color: #6b7280; }
    #addNoteBtn, #addTodoBtn, #clearNotesBtn, #clearTodosBtn { background: #f3f4f6; border: 1px solid #d1d5db; border-radius: 4px; padding: 2px 10px; cursor: pointer; font-size: 0.8em; white-space: nowrap; }
    #addNoteBtn:hover, #addTodoBtn:hover, #clearNotesBtn:hover, #clearTodosBtn:hover { background: #e5e7eb; }
    .notes-undo-btn { background: #fffbeb; border: 1px solid #fcd34d; border-radius: 4px; padding: 2px 10px; cursor: pointer; font-size: 0.8em; white-space: nowrap; color: #92400e; }
    .notes-undo-btn:hover { background: #fef3c7; }
    #notesContainer { display: flex; flex-wrap: wrap; gap: 10px; }
    .note-card { width: 160px; min-height: 120px; border-radius: 6px; padding: 8px; position: relative; box-shadow: 2px 2px 6px rgba(0,0,0,0.12); display: flex; flex-direction: column; }
    .note-card textarea { flex: 1; border: none; background: transparent; resize: none; font-size: 0.82em; font-family: inherit; outline: none; line-height: 1.4; min-height: 90px; }
    .note-del { position: absolute; top: 4px; right: 4px; background: none; border: none; cursor: pointer; font-size: 0.75em; color: #9ca3af; line-height: 1; padding: 2px 4px; border-radius: 3px; }
    .note-del:hover { background: rgba(0,0,0,0.08); color: #374151; }
    .todo-item { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-bottom: 1px solid #f3f4f6; }
    .todo-item:last-child { border-bottom: none; }
    .todo-cb { width: 16px; height: 16px; cursor: pointer; flex-shrink: 0; }
    .todo-text { flex: 1; border: none; outline: none; font-size: 0.85em; font-family: inherit; background: transparent; }
    .todo-text.done { text-decoration: line-through; color: #9ca3af; }
    .todo-del { background: none; border: none; color: #d1d5db; cursor: pointer; font-size: 0.9em; padding: 0 2px; }
    .todo-del:hover { color: #ef4444; }

    /* ---- SUBJECTS SECTION ---- */
    #subjectsSection {
      display: none;
      margin-top: 18px;
      background: white;
      border-radius: 6px;
      padding: 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }
    body.edit-mode #subjectsSection { display: block; }
    #subjectsSection h2 { font-size: 0.95em; font-weight: 600; margin-bottom: 12px; color: #374151; }
    .subject-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
    .subject-code-input { border: 1px solid #e5e7eb; border-radius: 4px; padding: 3px 8px; width: 70px; font-size: 0.9em; font-weight: 600; outline: none; }
    .subject-code-input:focus { border-color: #3b82f6; }
    .subject-name-input { border: 1px solid #e5e7eb; border-radius: 4px; padding: 3px 8px; flex: 1; min-width: 120px; font-size: 0.9em; outline: none; }
    .subject-name-input:focus { border-color: #3b82f6; }
    .subject-color-input { width: 32px; height: 28px; border: 1px solid #e5e7eb; border-radius: 4px; padding: 1px; cursor: pointer; }
    #addSubjectBtn { background: none; border: 1px dashed #9ca3af; color: #6b7280; border-radius: 4px; cursor: pointer; padding: 3px 8px; font-size: 0.78em; margin-top: 4px; }
    #addSubjectBtn:hover { border-color: #3b82f6; color: #3b82f6; }
    #subjectAddError { font-size: 0.78em; color: #dc2626; margin-top: 4px; min-height: 1em; }
    .cell-subjects { display: flex; flex-wrap: wrap; gap: 3px; margin-bottom: 3px; align-items: center; }
    .cell-subject-badge { font-size: 0.82em; font-weight: 700; padding: 1px 6px; border-radius: 3px; color: white; display: inline-block; line-height: 1.5; }
    #popupSubjects { padding: 10px 15px; border-bottom: 1px solid #e5e7eb; flex-shrink: 0; }
    .popup-subjects-label { font-size: 0.78em; color: #6b7280; margin-bottom: 5px; }
    .popup-subjects-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 6px; }
    .popup-subject-chip { padding: 3px 8px; border-radius: 4px; color: white; border: none; cursor: pointer; font-size: 0.85em; font-weight: 600; display: flex; align-items: center; gap: 4px; }
    .popup-subject-chip:hover { opacity: 0.85; }
    .popup-subjects-registry { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 6px; }
    .popup-subject-btn { padding: 3px 10px; border-radius: 4px; border: 1px solid #d1d5db; background: white; cursor: pointer; font-size: 0.82em; font-weight: 600; transition: all 0.1s; }
    .popup-subject-btn:hover { border-color: #3b82f6; }
    .popup-subject-btn.selected { color: white; border-color: transparent; }

    .note-print-text { display: none; font-size: 0.82em; font-family: inherit; line-height: 1.4; white-space: pre-wrap; }

    @media print {
      body { background: white; }
      #toolbar, #registrySection, #rhythmsSection, #breaksSection, #subjectsSection, .popup-time-row { display: none !important; }
      body:not(.print-has-notes) #notesArea { display: none !important; }
      body.print-has-notes #notesArea { display: block; }
      #notesArea { page-break-before: always; padding: 0 16px 24px; }
      .note-del, #addNoteBtn, .notes-color-btns, #addTodoBtn, .todo-del, #clearNotesBtn, #clearTodosBtn, .notes-undo-btn { display: none !important; }
      .note-card textarea { display: none !important; }
      .note-print-text { display: block; }
      .break-label { display: inline !important; }
      @page { size: A4 landscape; margin: 8mm; }
      html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      body { margin: 0; padding: 0; }
      main { padding: 0; max-width: 100%; }
      #grid { box-shadow: none; border-radius: 0; width: 100%; }
      #grid th, #grid td { border: 1px solid #888; font-size: 11px; }
      .lesson-cell { cursor: default; }
      .lesson-cell.has-content { background: #fffde7 !important; -webkit-print-color-adjust: exact; }
      @page { size: A4 landscape; margin: 1.2cm; }
    }
  </style>
</head>

      <button id="saveBtn">💾 Tallenna</button>

    <div id="notesArea">

              <button class="color-btn" data-color="#fce7f3" style="background:#fce7f3"></button>
              <button class="color-btn" data-color="#dbeafe" style="background:#dbeafe"></button>
              <button class="color-btn" data-color="#dcfce7" style="background:#dcfce7"></button>

  <div id="popupOverlay">
    <div id="popup">
      <div id="popupHeader">
        <span id="popupTitle"></span>
        <button id="popupClose">✕</button>
      </div>
      <div class="popup-time-row" id="popupTimeRow">
        <label>Alku</label>
        <input type="time" id="popupStartTime" class="popup-time-input">
        <label>Loppu</label>
        <input type="time" id="popupEndTime" class="popup-time-input">
        <button id="popupResetTime">↺ Oletusaika</button>
      </div>
      <div id="popupSubjects"></div>
      <div id="popupParticipants"></div>
      <textarea id="popupText" placeholder="Tunnin sisältö..."></textarea>
      <div class="popup-copy-row">
        <label>Kopioi tunti →</label>
        <select id="copyTargetDay" class="popup-copy-select">
          <option value="0">Maanantai</option>
          <option value="1">Tiistai</option>
          <option value="2">Keskiviikko</option>
          <option value="3">Torstai</option>
          <option value="4">Perjantai</option>
        </select>
        <select id="copyTargetSlot" class="popup-copy-select">
          <option value="0">T1</option><option value="1">T2</option><option value="2">T3</option>
          <option value="3">T4</option><option value="4">T5</option><option value="5">T6</option>
          <option value="6">T7</option>
        </select>
        <button id="copySlotBtn">Kopioi</button>
        <span id="copySlotFeedback"></span>
      </div>
      <div class="popup-lunch-row">
        <label>🍽️ Ruokailu alkaa</label>
        <input type="time" id="lunchStartInput" class="lunch-time-input">
        <select id="lunchDuration" class="lunch-dur-select">
          <option value="15">15 min</option>
          <option value="20">20 min</option>
        </select>
        <button id="clearLunchBtn">Poista</button>
      </div>
      <div class="popup-lunch-row">
        <button id="supervisionBtn" style="background:white;border:1px solid #d1d5db;border-radius:4px;padding:4px 12px;cursor:pointer;font-size:0.85em;">🏃 Välkkävalvonta</button>
        <button id="clearCellBtn" style="margin-left:auto;background:none;border:1px solid #fca5a5;color:#ef4444;border-radius:4px;padding:4px 10px;cursor:pointer;font-size:0.82em;">🗑 Tyhjennä solu</button>
      </div>
    </div>
  </div>

  <script>
    // =================== CONSTANTS ===================
    const DAYS      = ['Ma', 'Ti', 'Ke', 'To', 'Pe'];
    const DAY_FULL  = ['Maanantai', 'Tiistai', 'Keskiviikko', 'Torstai', 'Perjantai'];

    // =================== STATE ===================
    let dayBreaks = [];       // [dayIdx][{afterLesson, duration}]
    let registry = [];        // [{name:string, members:string[]}]
    let weekData = {};        // {weekKey: {dayAbbr: {slotIdx: {participants:[], text:"", startOverride?, endOverride?}}}}
    let currentWeekOffset = 0;
    let dirHandle = null;
    let dirty = false;
    let popupState = null;    // {dayIdx, slotIdx} or null
    let popupParticipants = [];
    let subjects = [];            // [{code, name, color}]
    let popupSubjects = [];       // codes selected in current popup
    let rhythms = [
      { name: 'A', startMinutes: 505 },
      { name: 'B', startMinutes: 510 },
    ];
    let dayRhythms = [0, 0, 0, 0, 0];
    let undoState = null;  // {weekKey, affected:[{dayIdx, breaks, rhythm, cells}]}

    // =================== SUBJECTS ===================
    function loadSubjects() {
      try { subjects = JSON.parse(localStorage.getItem('cp_subjects') || '[]'); } catch(e) { subjects = []; }
    }
    function saveSubjects() {
      localStorage.setItem('cp_subjects', JSON.stringify(subjects));
    }
    function normalizeCode(s) {
      return s.trim().toUpperCase();
    }

    // =================== TIME UTILS ===================
    function minToTime(m) {
      return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
    }

    function getWeekInfo(offset) {
      const now = new Date();
      const today = new Date(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()));
      const dow = (today.getUTCDay() + 6) % 7; // 0=Mon
      const monday = new Date(today);
      monday.setUTCDate(today.getUTCDate() - dow + offset * 7);
      const dates = [];
      for (let i = 0; i < 5; i++) {
        const d = new Date(monday);
        d.setUTCDate(monday.getUTCDate() + i);
        dates.push(d);
      }
      // ISO week: based on Thursday of the week
      const thu = new Date(monday);
      thu.setUTCDate(monday.getUTCDate() + 3);
      const yearStart = new Date(Date.UTC(thu.getUTCFullYear(), 0, 1));
      const week = Math.ceil(((thu - yearStart) / 86400000 + 1) / 7);
      return { year: thu.getUTCFullYear(), week, dates };
    }

    function getWeekKey(offset) {
      const { year, week } = getWeekInfo(offset);
      return `${year}_W${String(week).padStart(2, '0')}`;
    }

    function fmtDate(d) {
      return `${d.getUTCDate()}.${d.getUTCMonth() + 1}.`;
    }

    // =================== SCHEDULE (per-day breaks) ===================
    const LESSON_COUNT = 7;

    function defaultDayBreaks() {
      return Array.from({ length: 5 }, () => []);
    }

    function computeDaySlotTime(dayIdx, slotIdx) {
      const startMin = rhythms[dayRhythms[dayIdx]].startMinutes;
      let time = startMin;
      for (let i = 0; i < slotIdx; i++) {
        time += 45;
        const brk = (dayBreaks[dayIdx] || []).find(b => b.afterLesson === i);
        if (brk) time += brk.duration;
      }
      return { start: time, end: time + 45 };
    }

    function computeCascadingSlotTime(dayIdx, slotIdx, weekKey) {
      const startMin = rhythms[dayRhythms[dayIdx]].startMinutes;
      let time = startMin;
      for (let i = 0; i < slotIdx; i++) {
        const prevCell = ((weekData[weekKey] || {})[DAYS[dayIdx]] || {})[String(i)];
        if (prevCell && prevCell.endOverride != null) {
          time = prevCell.endOverride;
        } else {
          time += 45;
        }
        const brk = (dayBreaks[dayIdx] || []).find(b => b.afterLesson === i);
        if (brk) time += brk.duration;
      }
      return { start: time, end: time + 45 };
    }

    function getCellTime(dayIdx, slotIdx, weekKey) {
      const cell = ((weekData[weekKey] || {})[DAYS[dayIdx]] || {})[String(slotIdx)];
      if (cell && cell.startOverride != null) {
        return { start: cell.startOverride, end: cell.endOverride };
      }
      return computeCascadingSlotTime(dayIdx, slotIdx, weekKey);
    }

    // =================== RENDER GRID HEADER ===================
    function renderGridHeader() {
      const headRow = document.getElementById('gridHeadRow');
      const isEdit = document.body.classList.contains('edit-mode');
      while (headRow.children.length > 1) headRow.removeChild(headRow.lastChild);
      for (let d = 0; d < 5; d++) {
        const th = document.createElement('th');
        if (!isEdit) {
          th.textContent = `${DAY_FULL[d]} (${rhythms[dayRhythms[d]].name || '?'})`;
          const capD = d;
          const clrBtn = document.createElement('button');
          clrBtn.textContent = '🗑';
          clrBtn.title = 'Tyhjennä koko päivä';
          clrBtn.style.cssText = 'margin-left:6px;background:none;border:none;cursor:pointer;opacity:0.45;font-size:0.85em;vertical-align:middle;';
          clrBtn.addEventListener('mouseover', () => clrBtn.style.opacity = '1');
          clrBtn.addEventListener('mouseout', () => clrBtn.style.opacity = '0.45');
          clrBtn.addEventListener('click', e => {
            e.stopPropagation();
            e.preventDefault();
            if (!confirm(`Tyhjennetäänkö kaikki ${DAY_FULL[capD]}-sarakkeen solut?`)) return;
            const key = getWeekKey(currentWeekOffset);
            if (!weekData[key]) weekData[key] = {};
            weekData[key][DAYS[capD]] = {};
            dirty = true; renderGrid();
          });
          th.appendChild(clrBtn);
        } else {
          const span = document.createElement('span');
          span.textContent = DAY_FULL[d];
          th.appendChild(span);
          const sel = document.createElement('select');
          sel.className = 'day-th-select';
          rhythms.forEach((r, ri) => {
            const opt = document.createElement('option');
            opt.value = String(ri);
            opt.textContent = r.name || `Rytmi ${ri + 1}`;
            if (dayRhythms[d] === ri) opt.selected = true;
            sel.appendChild(opt);
          });
          const capD = d;
          sel.addEventListener('change', () => { dayRhythms[capD] = parseInt(sel.value); renderGridHeader(); });
          th.appendChild(sel);
        }
        headRow.appendChild(th);
      }
    }

    // =================== RENDER GRID ===================
    function renderGrid() {
      renderGridHeader();
      const tbody = document.getElementById('gridBody');
      tbody.innerHTML = '';
      const key = getWeekKey(currentWeekOffset);
      const dayData = weekData[key] || {};

      for (let li = 0; li < LESSON_COUNT; li++) {
        const curLi = li;
        const tr = document.createElement('tr');

        const tc = document.createElement('td');
        tc.className = 'time-cell';
        tc.textContent = `T${li + 1}`;
        tr.appendChild(tc);

        for (let d = 0; d < 5; d++) {
          const td = document.createElement('td');
          td.className = 'lesson-cell';

          const timeDiv = document.createElement('div');
          const t = getCellTime(d, curLi, key);
          timeDiv.className = 'cell-time';
          const hasOverride = ((weekData[key] || {})[DAYS[d]] || {})[String(curLi)]?.startOverride != null;
          if (hasOverride) timeDiv.classList.add('time-overridden');
          timeDiv.textContent = minToTime(t.start) + '–' + minToTime(t.end);
          td.appendChild(timeDiv);

          const cell = (dayData[DAYS[d]] || {})[String(curLi)];
          if (cell && cell.subjects?.length) {
            const subRow = document.createElement('div');
            subRow.className = 'cell-subjects';
            for (const code of cell.subjects) {
              const s = subjects.find(x => x.code === code);
              const badge = document.createElement('span');
              badge.className = 'cell-subject-badge';
              badge.style.background = s ? s.color : '#9ca3af';
              badge.textContent = code;
              subRow.appendChild(badge);
            }
            td.appendChild(subRow);
          }

          if (cell && (cell.participants?.length || cell.text || cell.subjects?.length)) {
            td.classList.add('has-content');
            if (cell.participants?.length) {
              const pDiv = document.createElement('div');
              pDiv.className = 'cell-participants';
              pDiv.textContent = cell.participants.join(', ');
              td.appendChild(pDiv);
            }
            if (cell.text) {
              const tDiv = document.createElement('div');
              tDiv.className = 'cell-text';
              tDiv.textContent = cell.text;
              td.appendChild(tDiv);
            }
          }

          const brk = (dayBreaks[d] || []).find(b => b.afterLesson === curLi);
          if (brk) {
            const brkDiv = document.createElement('div');
            brkDiv.className = 'cell-break';
            brkDiv.textContent = `░ ${brk.duration} min ░`;
            td.appendChild(brkDiv);
          }

          if (cell && cell.lunchStart != null) {
            const lDiv = document.createElement('div');
            lDiv.className = 'cell-lunch';
            lDiv.textContent = `🍽️ ${minToTime(cell.lunchStart)} (${cell.lunchDuration || 15}min)`;
            td.appendChild(lDiv);
          }

          if (cell && cell.breakSupervision) {
            const sDiv = document.createElement('div');
            sDiv.className = 'cell-supervision';
            sDiv.textContent = '🏃 Välkkävalvonta';
            td.appendChild(sDiv);
          }

          td.addEventListener('click', () => openPopup(d, curLi));
          tr.appendChild(td);
        }
        tbody.appendChild(tr);
      }
    }

    // =================== HEADER ===================
    function updateHeader() {
      const { week, year, dates } = getWeekInfo(currentWeekOffset);
      const thisYear = new Date().getFullYear();
      const yearSuffix = year !== thisYear ? ' ' + year : '';
      document.getElementById('weekLabel').textContent =
        `Viikko ${week}  (${fmtDate(dates[0])} – ${fmtDate(dates[4])}${yearSuffix})`;
    }

    // =================== POPUP ===================
    function openPopup(dayIdx, slotIdx) {
      popupState = { dayIdx, slotIdx };
      const key = getWeekKey(currentWeekOffset);
      const cell = ((weekData[key] || {})[DAYS[dayIdx]] || {})[String(slotIdx)] || { participants: [], text: '' };
      popupParticipants = [...(cell.participants || [])];
      popupSubjects = [...(cell.subjects || [])];

      const t = getCellTime(dayIdx, slotIdx, key);
      document.getElementById('popupTitle').textContent =
        `${DAY_FULL[dayIdx]}  T${slotIdx + 1}`;

      document.getElementById('popupStartTime').value = minToTime(t.start);
      document.getElementById('popupEndTime').value = minToTime(t.end);
      const timeRow = document.getElementById('popupTimeRow');
      if (cell.startOverride != null) timeRow.classList.add('has-override');
      else timeRow.classList.remove('has-override');

      document.getElementById('popupText').value = cell.text || '';
      document.getElementById('lunchStartInput').value = cell.lunchStart != null ? minToTime(cell.lunchStart) : '';
      document.getElementById('lunchDuration').value = String(cell.lunchDuration || 15);
      const supBtn = document.getElementById('supervisionBtn');
      supBtn.style.background = cell.breakSupervision ? '#dbeafe' : 'white';
      supBtn.style.borderColor = cell.breakSupervision ? '#3b82f6' : '#d1d5db';
      supBtn.style.color = cell.breakSupervision ? '#1d4ed8' : '';
      supBtn.style.fontWeight = cell.breakSupervision ? '600' : '';
      supBtn.dataset.active = cell.breakSupervision ? '1' : '0';
      renderPopupParticipants();
      renderPopupSubjects();
      document.getElementById('popupOverlay').classList.add('open');
      document.getElementById('popupText').focus();
    }

    function closePopup() {
      if (!popupState) return;
      const { dayIdx, slotIdx } = popupState;
      const key = getWeekKey(currentWeekOffset);
      const text = document.getElementById('popupText').value;

      const startVal = document.getElementById('popupStartTime').value;
      const endVal = document.getElementById('popupEndTime').value;
      const computed = computeCascadingSlotTime(dayIdx, slotIdx, key);
      const startMin = parseInt(startVal.split(':')[0]) * 60 + parseInt(startVal.split(':')[1]);
      const endMin = parseInt(endVal.split(':')[0]) * 60 + parseInt(endVal.split(':')[1]);
      const hasOverride = startMin !== computed.start || endMin !== computed.end;

      if (!weekData[key]) weekData[key] = {};
      if (!weekData[key][DAYS[dayIdx]]) weekData[key][DAYS[dayIdx]] = {};
      const slotData = { participants: [...popupParticipants], text, subjects: [...popupSubjects] };
      if (hasOverride) { slotData.startOverride = startMin; slotData.endOverride = endMin; }
      const lunchVal = document.getElementById('lunchStartInput').value;
      if (lunchVal) {
        const lp = lunchVal.split(':');
        slotData.lunchStart = parseInt(lp[0]) * 60 + parseInt(lp[1]);
        slotData.lunchDuration = parseInt(document.getElementById('lunchDuration').value);
      }
      if (document.getElementById('supervisionBtn').dataset.active === '1') slotData.breakSupervision = true;
      weekData[key][DAYS[dayIdx]][String(slotIdx)] = slotData;
      dirty = true;
      popupState = null;
      popupParticipants = [];
      popupSubjects = [];
      document.getElementById('popupOverlay').classList.remove('open');
      renderGrid();
    }

    function renderPopupParticipants() {
      const container = document.getElementById('popupParticipants');
      container.innerHTML = '';

      // Selected participants as removable chips
      if (popupParticipants.length) {
        const row = document.createElement('div');
        row.className = 'popup-selected-row';
        for (const m of [...popupParticipants]) {
          const chip = document.createElement('button');
          chip.className = 'popup-selected-chip';
          chip.textContent = m + ' ✕';
          const capM = m;
          chip.addEventListener('click', () => {
            const idx = popupParticipants.indexOf(capM);
            if (idx >= 0) popupParticipants.splice(idx, 1);
            renderPopupParticipants();
          });
          row.appendChild(chip);
        }
        container.appendChild(row);
      }

      // Free-text add row
      const addRow = document.createElement('div');
      addRow.className = 'popup-add-row';
      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'popup-add-input';
      input.placeholder = 'Lisää osallistuja...';
      const addBtn = document.createElement('button');
      addBtn.className = 'popup-add-btn';
      addBtn.textContent = '+';
      const doAdd = () => {
        const val = input.value.trim();
        if (val && !popupParticipants.includes(val)) {
          popupParticipants.push(val);
          renderPopupParticipants();
        } else {
          input.value = '';
        }
      };
      addBtn.addEventListener('click', doAdd);
      input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); doAdd(); } });
      addRow.appendChild(input);
      addRow.appendChild(addBtn);
      container.appendChild(addRow);

      if (!registry.length) {
        const em = document.createElement('em');
        em.style.cssText = 'color:#9ca3af;font-size:0.82em';
        em.textContent = 'Rekisteri tyhjä – lisää ryhmiä muokkaustilassa.';
        container.appendChild(em);
        return;
      }
      for (const group of registry) {
        const gdiv = document.createElement('div');
        gdiv.className = 'popup-group';

        const ghdr = document.createElement('div');
        ghdr.className = 'popup-group-header';

        const gname = document.createElement('span');
        gname.textContent = group.name || '(ryhmä)';
        ghdr.appendChild(gname);

        const qBtn = document.createElement('button');
        qBtn.className = 'popup-quick-btn';
        qBtn.textContent = 'Valitse kaikki →';
        const cap = group;
        qBtn.addEventListener('click', () => {
          const newM = cap.members.filter(m => m.trim());
          for (const m of newM) { if (!popupParticipants.includes(m)) popupParticipants.push(m); }
          renderPopupParticipants();
        });
        ghdr.appendChild(qBtn);
        gdiv.appendChild(ghdr);

        const mems = document.createElement('div');
        mems.className = 'popup-members';
        for (const m of group.members) {
          if (!m.trim()) continue;
          const btn = document.createElement('button');
          btn.className = 'popup-member-btn' + (popupParticipants.includes(m) ? ' selected' : '');
          btn.textContent = m;
          const capM = m;
          btn.addEventListener('click', () => {
            const idx = popupParticipants.indexOf(capM);
            if (idx >= 0) popupParticipants.splice(idx, 1);
            else popupParticipants.push(capM);
            renderPopupParticipants();
          });
          mems.appendChild(btn);
        }
        gdiv.appendChild(mems);
        container.appendChild(gdiv);
      }
    }

    // =================== REGISTRY RENDER ===================
    function renderRegistry() {
      const container = document.getElementById('registryGroups');
      container.innerHTML = '';
      registry.forEach((group, gi) => {
        const gdiv = document.createElement('div');
        gdiv.className = 'reg-group';

        const ghdr = document.createElement('div');
        ghdr.className = 'reg-group-header';

        const nameIn = document.createElement('input');
        nameIn.className = 'group-name-input';
        nameIn.value = group.name;
        nameIn.placeholder = 'Ryhmän nimi';
        nameIn.addEventListener('input', () => { group.name = nameIn.value; });
        ghdr.appendChild(nameIn);

        const delG = document.createElement('button');
        delG.className = 'del-btn';
        delG.title = 'Poista ryhmä';
        delG.textContent = '🗑';
        delG.addEventListener('click', () => { registry.splice(gi, 1); renderRegistry(); });

        const upBtn = document.createElement('button');
        upBtn.className = 'reorder-btn';

    // =================== SUBJECTS RENDER ===================
    function renderSubjectsSection() {
      const container = document.getElementById('subjectsGroups');
      container.innerHTML = '';
      subjects.forEach((s, si) => {
        const row = document.createElement('div');
        row.className = 'subject-row';

        const codeIn = document.createElement('input');
        codeIn.className = 'subject-code-input';
        codeIn.value = s.code;
        codeIn.placeholder = 'KOO';
        codeIn.maxLength = 10;
        codeIn.addEventListener('change', () => {
          const normalized = normalizeCode(codeIn.value);
          if (!normalized) { codeIn.value = s.code; return; }
          if (subjects.some((x, xi) => xi !== si && x.code === normalized)) {
            codeIn.style.borderColor = '#dc2626'; codeIn.value = s.code;
            setTimeout(() => { codeIn.style.borderColor = ''; }, 1500);
            return;
          }
          const oldCode = s.code;
          for (const wk of Object.keys(weekData)) {
            for (const day of Object.keys(weekData[wk])) {
              for (const slot of Object.keys(weekData[wk][day])) {
                const cell = weekData[wk][day][slot];
                if (Array.isArray(cell.subjects)) cell.subjects = cell.subjects.map(c => c === oldCode ? normalized : c);
              }
            }
          }
          s.code = normalized; codeIn.value = normalized;
          saveSubjects(); renderGrid();
        });
        row.appendChild(codeIn);

        const nameIn = document.createElement('input');
        nameIn.className = 'subject-name-input';
        nameIn.value = s.name;
        nameIn.placeholder = 'Aineen nimi';
        nameIn.addEventListener('input', () => { s.name = nameIn.value; saveSubjects(); });
        row.appendChild(nameIn);

        const colorIn = document.createElement('input');
        colorIn.type = 'color';
        colorIn.className = 'subject-color-input';
        colorIn.value = s.color;
        colorIn.addEventListener('input', () => { s.color = colorIn.value; saveSubjects(); renderGrid(); });
        row.appendChild(colorIn);

        const upBtn = document.createElement('button');
        upBtn.className = 'reorder-btn'; upBtn.textContent = '↑'; upBtn.disabled = si === 0;
        upBtn.addEventListener('click', () => {
          [subjects[si - 1], subjects[si]] = [subjects[si], subjects[si - 1]];
          saveSubjects(); renderSubjectsSection();
        });
        row.appendChild(upBtn);

        const downBtn = document.createElement('button');
        downBtn.className = 'reorder-btn'; downBtn.textContent = '↓'; downBtn.disabled = si === subjects.length - 1;
        downBtn.addEventListener('click', () => {
          [subjects[si], subjects[si + 1]] = [subjects[si + 1], subjects[si]];
          saveSubjects(); renderSubjectsSection();
        });
        row.appendChild(downBtn);

        const delBtn = document.createElement('button');
        delBtn.className = 'del-btn'; delBtn.textContent = '🗑';
        delBtn.addEventListener('click', () => {
          subjects.splice(si, 1);
          saveSubjects(); renderSubjectsSection(); renderGrid();
        });
        row.appendChild(delBtn);

        container.appendChild(row);
      });
    }

    function renderPopupSubjects() {
      const container = document.getElementById('popupSubjects');
      container.innerHTML = '';

      const lbl = document.createElement('div');
      lbl.className = 'popup-subjects-label';
      lbl.textContent = 'Oppiaine';
      container.appendChild(lbl);

      if (popupSubjects.length) {
        const chipsRow = document.createElement('div');
        chipsRow.className = 'popup-subjects-chips';
        for (const code of [...popupSubjects]) {
          const s = subjects.find(x => x.code === code);
          const chip = document.createElement('button');
          chip.className = 'popup-subject-chip';
          chip.style.background = s ? s.color : '#9ca3af';
          chip.textContent = code + ' ✕';
          const capCode = code;
          chip.addEventListener('click', () => {
            const idx = popupSubjects.indexOf(capCode);
            if (idx >= 0) popupSubjects.splice(idx, 1);
            renderPopupSubjects();
          });
          chipsRow.appendChild(chip);
        }
        container.appendChild(chipsRow);
      }

      if (subjects.length) {
        const regRow = document.createElement('div');
        regRow.className = 'popup-subjects-registry';
        for (const s of subjects) {
          const btn = document.createElement('button');
          const selected = popupSubjects.includes(s.code);
          btn.className = 'popup-subject-btn' + (selected ? ' selected' : '');
          if (selected) btn.style.background = s.color;
          btn.textContent = s.code;
          btn.title = s.name || s.code;
          const capCode = s.code;
          btn.addEventListener('click', () => {
            const idx = popupSubjects.indexOf(capCode);
            if (idx >= 0) popupSubjects.splice(idx, 1);
            else popupSubjects.push(capCode);
            renderPopupSubjects();
          });
          regRow.appendChild(btn);
        }
        container.appendChild(regRow);
      }

      const addRow = document.createElement('div');
      addRow.className = 'popup-add-row';
      const input = document.createElement('input');
      input.type = 'text'; input.className = 'popup-add-input';
      input.placeholder = 'Uusi tunnus...'; input.maxLength = 10;
      const addBtn = document.createElement('button');
      addBtn.className = 'popup-add-btn'; addBtn.textContent = '+';
      const doAdd = () => {
        const val = normalizeCode(input.value);
        if (!val) return;
        if (!subjects.find(x => x.code === val)) {
          subjects.push({ code: val, name: '', color: '#9ca3af' });
          saveSubjects();
        }
        if (!popupSubjects.includes(val)) popupSubjects.push(val);
        input.value = '';
        renderPopupSubjects();
      };
      addBtn.addEventListener('click', doAdd);
      input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); doAdd(); } });
      addRow.appendChild(input); addRow.appendChild(addBtn);
      container.appendChild(addRow);
    }

    // =================== BREAKS EDITOR ===================
    function performCopy(src, targets) {
      const key = getWeekKey(currentWeekOffset);
      undoState = {
        weekKey: key,
        affected: targets.map(tgt => ({
          dayIdx: tgt,
          breaks: JSON.parse(JSON.stringify(dayBreaks[tgt] || [])),
          rhythm: dayRhythms[tgt],
          cells: JSON.parse(JSON.stringify((weekData[key] || {})[DAYS[tgt]] || {}))
        }))
      };
      const srcCells = JSON.parse(JSON.stringify((weekData[key] || {})[DAYS[src]] || {}));
      for (const tgt of targets) {
        dayBreaks[tgt] = JSON.parse(JSON.stringify(dayBreaks[src] || []));
        dayRhythms[tgt] = dayRhythms[src];
        if (!weekData[key]) weekData[key] = {};
        weekData[key][DAYS[tgt]] = JSON.parse(JSON.stringify(srcCells));
      }
      dirty = true;
      renderBreaksEditor(); renderGrid();
    }

    function renderBreaksEditor() {
      const container = document.getElementById('breaksGroups');
      container.innerHTML = '';
      for (let d = 0; d < 5; d++) {
        const row = document.createElement('div');
        row.className = 'breaks-day-row';
        const lbl = document.createElement('span');
        lbl.className = 'breaks-day-label';
        lbl.textContent = DAY_FULL[d];
        row.appendChild(lbl);

        for (let li = 0; li < LESSON_COUNT; li++) {
          const slotLbl = document.createElement('span');
          slotLbl.className = 'break-slot-label';
          slotLbl.textContent = `T${li + 1}`;
          row.appendChild(slotLbl);

          if (li < LESSON_COUNT - 1) {
            const brk = (dayBreaks[d] || []).find(b => b.afterLesson === li);
            if (brk) {
              const entry = document.createElement('span');
              entry.className = 'break-entry';
              const dec = document.createElement('button'); dec.className = 'break-dur-dec'; dec.textContent = '−';
              const durSpan = document.createElement('span'); durSpan.textContent = brk.duration + 'min';
              const inc = document.createElement('button'); inc.className = 'break-dur-inc'; inc.textContent = '+';
              const del = document.createElement('button'); del.className = 'break-del-entry'; del.textContent = '×';
              const capD = d, capLi = li, capBrk = brk;
              dec.addEventListener('click', () => { if (capBrk.duration > 15) { capBrk.duration -= 5; durSpan.textContent = capBrk.duration + 'min'; renderGrid(); } });
              inc.addEventListener('click', () => { if (capBrk.duration < 30) { capBrk.duration += 5; durSpan.textContent = capBrk.duration + 'min'; renderGrid(); } });
              del.addEventListener('click', () => { dayBreaks[capD] = dayBreaks[capD].filter(b => b.afterLesson !== capLi); renderBreaksEditor(); renderGrid(); });
              entry.appendChild(dec); entry.appendChild(durSpan); entry.appendChild(inc); entry.appendChild(del);
              row.appendChild(entry);
            } else {
              const addBtn = document.createElement('button');
              addBtn.className = 'break-add-btn'; addBtn.textContent = '+';
              addBtn.title = `Lisää välkkä T${li + 1} jälkeen`;
              const capD = d, capLi = li;
              addBtn.addEventListener('click', () => {
                if (!dayBreaks[capD]) dayBreaks[capD] = [];
                dayBreaks[capD].push({ afterLesson: capLi, duration: 15 });
                dayBreaks[capD].sort((a, b) => a.afterLesson - b.afterLesson);
                renderBreaksEditor(); renderGrid();
              });
              row.appendChild(addBtn);
            }
          }
        }
        container.appendChild(row);
      }

      // Day copy form
      const copyRow = document.createElement('div');
      copyRow.className = 'copy-row';
      const copyLbl = document.createElement('label');
      copyLbl.textContent = 'Kopioi p\u00e4iv\u00e4n asetukset:';
      const srcSel = document.createElement('select');
      srcSel.className = 'copy-day-select';
      const tgtSel = document.createElement('select');
      tgtSel.className = 'copy-day-select';
      DAY_FULL.forEach((name, i) => {
        const o1 = document.createElement('option'); o1.value = i; o1.textContent = name; srcSel.appendChild(o1);
        const o2 = document.createElement('option'); o2.value = i; o2.textContent = name; tgtSel.appendChild(o2);
      });
      if (DAY_FULL.length > 1) tgtSel.value = '1';
      const copyBtn = document.createElement('button');
      copyBtn.className = 'copy-day-btn'; copyBtn.textContent = 'Kopioi';
      const copyAllBtn = document.createElement('button');
      copyAllBtn.className = 'copy-all-btn'; copyAllBtn.textContent = 'Kopioi kaikille';
      const feedbackSpan = document.createElement('span');
      feedbackSpan.id = 'copyDayFeedback';
      feedbackSpan.style.cssText = 'font-size:0.78em;color:#16a34a;';
      const undoBtn = document.createElement('button');
      undoBtn.className = 'undo-copy-btn'; undoBtn.textContent = '\u21ba Kumoa'; undoBtn.style.display = 'none';

      copyBtn.addEventListener('click', () => {
        const src = parseInt(srcSel.value), tgt = parseInt(tgtSel.value);
        if (src === tgt) return;
        performCopy(src, [tgt]);
        feedbackSpan.textContent = '\u2713 Kopioitu'; undoBtn.style.display = '';
        setTimeout(() => { feedbackSpan.textContent = ''; }, 2000);
      });
      copyAllBtn.addEventListener('click', () => {
        const src = parseInt(srcSel.value);
        const targets = [0,1,2,3,4].filter(d => d !== src);
        performCopy(src, targets);
        feedbackSpan.textContent = '\u2713 Kopioitu kaikille'; undoBtn.style.display = '';
        setTimeout(() => { feedbackSpan.textContent = ''; }, 2000);
      });
      undoBtn.addEventListener('click', () => {
        if (!undoState) return;
        const key = undoState.weekKey;
        for (const { dayIdx, breaks, rhythm, cells } of undoState.affected) {
          dayBreaks[dayIdx] = breaks;
          dayRhythms[dayIdx] = rhythm;
          if (!weekData[key]) weekData[key] = {};
          weekData[key][DAYS[dayIdx]] = cells;
        }
        undoState = null;
        undoBtn.style.display = 'none';
        dirty = true;
        renderBreaksEditor(); renderGrid();
      });

      copyRow.appendChild(copyLbl);
      copyRow.appendChild(srcSel);
      copyRow.appendChild(document.createTextNode(' \u2192 '));
      copyRow.appendChild(tgtSel);
      copyRow.appendChild(copyBtn);
      copyRow.appendChild(copyAllBtn);
      copyRow.appendChild(feedbackSpan);
      copyRow.appendChild(undoBtn);
      container.appendChild(copyRow);
    }

    // =================== FILE PERSISTENCE ===================
    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open('classplanner', 1);
        req.onupgradeneeded = e => e.target.result.createObjectStore('handles');
        req.onsuccess = e => resolve(e.target.result);
        req.onerror = e => reject(e.target.error);
      });
    }
    async function saveHandleToDB(handle) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction('handles', 'readwrite');
        tx.objectStore('handles').put(handle, 'dirHandle');
        tx.oncomplete = resolve; tx.onerror = reject;
      });
    }
    async function loadHandleFromDB() {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction('handles', 'readonly');
        const req = tx.objectStore('handles').get('dirHandle');
        req.onsuccess = e => resolve(e.target.result);
        req.onerror = e => reject(e.target.error);
      });
    }
    async function tryRestoreHandle() {
      const btn = document.getElementById('restoreBtn');
      try {
        const handle = await loadHandleFromDB();
        if (!handle) return;
        const perm = await handle.requestPermission({ mode: 'readwrite' });
        if (perm === 'granted') {
          dirHandle = handle;
          document.getElementById('folderName').textContent = handle.name;
          btn.style.display = 'none';
          await loadConfig();
          await loadWeek();
        } else {
          btn.style.display = 'none';
        }
      } catch (e) {
        console.log('Kansion palautus epäonnistui:', e);
        btn.style.display = 'none';
      }
    }
    async function checkForStoredHandle() {
      try {
        const handle = await loadHandleFromDB();
        if (!handle) return;
        const btn = document.getElementById('restoreBtn');
        document.getElementById('restoreName').textContent = handle.name;
        btn.style.display = '';
      } catch (e) {
        // IndexedDB unavailable, silently ignore
      }
    }
    async function selectFolder() {
      if (!window.showDirectoryPicker) {
        alert('Selaimesi ei tue kansionvalintaa (showDirectoryPicker). Käytä Chrome- tai Edge-selainta localhost-osoitteella.');
        return;
      }
      try {
        dirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
        document.getElementById('folderName').textContent = dirHandle.name;
        await saveHandleToDB(dirHandle);
        await loadConfig();
        await loadWeek();
      } catch (e) {
        if (e.name !== 'AbortError') console.error('Kansion valinta epäonnistui:', e);
      }
    }

    async function saveTemplate() {
      if (!dirHandle) { alert('Valitse ensin tallennuskansio (📁).'); return; }
      const key = getWeekKey(currentWeekOffset);
      const slots = (weekData[key] || {});
      try {
        const fh = await dirHandle.getFileHandle('template.json', { create: true });
        const w = await fh.createWritable();
        await w.write(JSON.stringify({ slots }, null, 2));
        await w.close();
        const btn = document.getElementById('templateBtn');
        const orig = btn.textContent; btn.textContent = '✓ Pohja tallennettu';
        setTimeout(() => { btn.textContent = orig; }, 1800);
      } catch (e) { alert('Pohjan tallennus epäonnistui: ' + e.message); }
    }
    async function applyTemplate(key) {
      if (!dirHandle) return;
      try {
        const fh = await dirHandle.getFileHandle('template.json');
        const data = JSON.parse(await (await fh.getFile()).text());
        if (data.slots) { weekData[key] = data.slots; renderGrid(); }
      } catch (e) { /* ei pohja-tiedostoa, ei hätää */ }
    }
    async function saveWeek() {
      if (!dirHandle) { alert('Valitse ensin tallennuskansio (📁).'); return; }
      const key = getWeekKey(currentWeekOffset);
      try {
        const fh = await dirHandle.getFileHandle(`viikko_${key}.json`, { create: true });
        const w = await fh.createWritable();
        await w.write(JSON.stringify({ weekKey: key, slots: weekData[key] || {}, notes: weekData[key]?.notes || [], todos: weekData[key]?.todos || [] }, null, 2));
        await w.close();
        dirty = false;
        // Brief visual feedback without alert
        const btn = document.getElementById('saveBtn');
        const orig = btn.textContent;
        btn.textContent = '✓ Tallennettu';
        setTimeout(() => { btn.textContent = orig; }, 1500);
      } catch (e) {
        alert('Tallentaminen epäonnistui: ' + e.message);
      }
    }

    async function loadWeek(showFeedback = false) {
      if (!dirHandle) {
        if (showFeedback) alert('Valitse ensin tallennuskansio (📁).');
        return;
      }
      const key = getWeekKey(currentWeekOffset);
      try {
        const fh = await dirHandle.getFileHandle(`viikko_${key}.json`);
        const file = await fh.getFile();
        const data = JSON.parse(await file.text());
        if (data.slots) weekData[key] = data.slots;
        if (Array.isArray(data.notes)) weekData[key].notes = data.notes;
        if (Array.isArray(data.todos)) weekData[key].todos = data.todos;
        loadNotesFromWeek(key);
        renderNotes(); renderTodos();
        renderGrid();
        if (showFeedback) {
          const btn = document.getElementById('loadBtn');
          const orig = btn.textContent; btn.textContent = '\u2713 Ladattu';
          setTimeout(() => { btn.textContent = orig; }, 1500);
        }
      } catch (e) {
        if (e.name === 'NotFoundError') {
          if (showFeedback) {
            const btn = document.getElementById('loadBtn');
            const orig = btn.textContent; btn.textContent = 'Ei dataa tälle viikolle';
            setTimeout(() => { btn.textContent = orig; }, 2000);
          }
          await applyTemplate(key);
        } else {
          console.error('Viikon lataus ep\u00e4onnistui:', e);
        }
      }
    }

    async function saveConfig() {
      if (!dirHandle) return;
      try {
        const fh = await dirHandle.getFileHandle('config.json', { create: true });
        const w = await fh.createWritable();
        await w.write(JSON.stringify({ dayBreaks, registry, rhythms, dayRhythms }, null, 2));
        await w.close();
      } catch (e) {
        console.error('Konfiguraation tallennus epäonnistui:', e);
      }
    }

    async function loadConfig() {
      if (!dirHandle) return;
      try {
        const fh = await dirHandle.getFileHandle('config.json');
        const file = await fh.getFile();
        const data = JSON.parse(await file.text());
        if (Array.isArray(data.dayBreaks) && data.dayBreaks.length === 5) {
          dayBreaks = data.dayBreaks;
        } else if (Array.isArray(data.schedule) && data.schedule.length) {
          // Migrate legacy schedule to per-day breaks
          let lessonCount = 0;
          const breaks = [];
          for (const slot of data.schedule) {
            if (slot.type === 'lesson') lessonCount++;
            else if (slot.type === 'break') breaks.push({ afterLesson: lessonCount - 1, duration: slot.duration });
          }
          dayBreaks = Array.from({ length: 5 }, () => breaks.map(b => ({ ...b })));
        }
        if (Array.isArray(data.registry)) registry = data.registry;
        if (Array.isArray(data.rhythms) && data.rhythms.length) rhythms = data.rhythms;
        if (Array.isArray(data.dayRhythms) && data.dayRhythms.length === 5) dayRhythms = data.dayRhythms;
        renderGrid();
        renderRegistry();
        renderRhythms();
        renderBreaksEditor();
      } catch (e) {
        if (e.name !== 'NotFoundError') console.error('Konfiguraation lataus epäonnistui:', e);
      }
    }

    // =================== WEEK NAVIGATION ===================
    function loadNotesFromWeek(key) {
      undoNotes = null; undoTodos = null;
      if (!weekData[key]) weekData[key] = {};
      if (!weekData[key].notes) weekData[key].notes = [];
      if (!weekData[key].todos) weekData[key].todos = [];
      notes = weekData[key].notes;
      todos = weekData[key].todos;
    }

    async function navigate(delta) {
      if (dirty && !confirm('Viikolla on tallentamattomia muutoksia. Vaihdetaanko silti?')) return;
      currentWeekOffset += delta;
      dirty = false;
      updateHeader();
      renderGrid();
      if (dirHandle) await loadWeek();
      else {
        loadNotesFromWeek(getWeekKey(currentWeekOffset));
        renderNotes(); renderTodos();
      }
    }

    // =================== NOTES & TODOS ===================
    let notes = [];
    let todos = [];
    let undoNotes = null;
    let undoTodos = null;
    let activeNoteColor = '#fef9c3';

    function saveNotes() { dirty = true; }
    function saveTodos() { dirty = true; }

    function renderNotes() {
      const c = document.getElementById('notesContainer');
      c.innerHTML = '';
      notes.forEach((n, i) => {
        const card = document.createElement('div');
        card.className = 'note-card';
        card.style.background = n.color || '#fef9c3';
        const ta = document.createElement('textarea');
        ta.value = n.text;
        ta.placeholder = 'Kirjoita muistiinpano...';
        ta.addEventListener('input', () => { notes[i].text = ta.value; saveNotes(); });
        const del = document.createElement('button');
        del.className = 'note-del'; del.textContent = '✕';
        del.addEventListener('click', () => { notes.splice(i, 1); saveNotes(); renderNotes(); });
        card.appendChild(del); card.appendChild(ta);
        c.appendChild(card);
      });
    }

    function renderTodos() {
      const c = document.getElementById('todosContainer');
      c.innerHTML = '';
      todos.forEach((t, i) => {
        const row = document.createElement('div');
        row.className = 'todo-item';
        const cb = document.createElement('input');
        cb.type = 'checkbox'; cb.className = 'todo-cb'; cb.checked = t.done;
        cb.addEventListener('change', () => { todos[i].done = cb.checked; inp.classList.toggle('done', cb.checked); saveTodos(); });
        const inp = document.createElement('input');
        inp.type = 'text'; inp.className = 'todo-text' + (t.done ? ' done' : '');
        inp.value = t.text; inp.placeholder = 'Tehtävä...';
        inp.addEventListener('input', () => { todos[i].text = inp.value; saveTodos(); });
        const del = document.createElement('button');
        del.className = 'todo-del'; del.textContent = '✕';
        del.addEventListener('click', () => { todos.splice(i, 1); saveTodos(); renderTodos(); });
        row.appendChild(cb); row.appendChild(inp); row.appendChild(del);
        c.appendChild(row);
      });
    }

    document.getElementById('addNoteBtn').addEventListener('click', () => {
      notes.push({ text: '', color: activeNoteColor }); saveNotes(); renderNotes();
    });
    document.getElementById('addTodoBtn').addEventListener('click', () => {
      todos.push({ text: '', done: false }); saveTodos(); renderTodos();
    });
    document.getElementById('clearNotesBtn').addEventListener('click', () => {
      if (!confirm('Tyhjennetäänkö kaikki muistiinpanot?')) return;
      undoNotes = notes.map(n => ({ ...n }));
      notes.length = 0;
      saveNotes(); renderNotes();
      const header = document.querySelector('.notes-panel .notes-header');
      const undoBtn = document.createElement('button');
      undoBtn.className = 'notes-undo-btn'; undoBtn.textContent = '↺ Kumoa';
      header.appendChild(undoBtn);
      const timer = setTimeout(() => { undoBtn.remove(); undoNotes = null; }, 5000);
      undoBtn.addEventListener('click', () => {
        clearTimeout(timer);
        notes.push(...undoNotes); undoNotes = null; undoBtn.remove();
        saveNotes(); renderNotes();
      });
    });
    document.getElementById('clearTodosBtn').addEventListener('click', () => {
      if (!confirm('Tyhjennetäänkö kaikki tehtävät?')) return;
      undoTodos = todos.map(t => ({ ...t }));
      todos.length = 0;
      saveTodos(); renderTodos();
      const header = document.querySelector('.todo-panel .notes-header');
      const undoBtn = document.createElement('button');
      undoBtn.className = 'notes-undo-btn'; undoBtn.textContent = '↺ Kumoa';
      header.appendChild(undoBtn);
      const timer = setTimeout(() => { undoBtn.remove(); undoTodos = null; }, 5000);
      undoBtn.addEventListener('click', () => {
        clearTimeout(timer);
        todos.push(...undoTodos); undoTodos = null; undoBtn.remove();
        saveTodos(); renderTodos();
      });
    });
    document.querySelectorAll('.color-btn').forEach(btn => {
      btn.addEventListener('click', () => { activeNoteColor = btn.dataset.color; });
    });
    renderNotes(); renderTodos();

    // =================== UNSAVED CHANGES GUARD ===================
    window.addEventListener('beforeunload', e => {
      if (dirty) { e.preventDefault(); e.returnValue = ''; }
    });

    // =================== EVENT WIRING ===================
    document.getElementById('editToggle').addEventListener('click', toggleEditMode);
    document.getElementById('folderBtn').addEventListener('click', selectFolder);
    document.getElementById('restoreBtn').addEventListener('click', tryRestoreHandle);
    document.getElementById('templateBtn').addEventListener('click', saveTemplate);
    document.getElementById('saveBtn').addEventListener('click', saveWeek);
    document.getElementById('loadBtn').addEventListener('click', () => loadWeek(true));
    function beforePrint() {
      document.querySelectorAll('.note-card textarea').forEach(ta => {
        const div = document.createElement('div');
        div.className = 'note-print-text';
        div.textContent = ta.value;
        ta.after(div);
      });
      if (notes.length > 0 || todos.length > 0) document.body.classList.add('print-has-notes');
    }
    function afterPrint() {
      document.querySelectorAll('.note-print-text').forEach(el => el.remove());
      document.body.classList.remove('print-has-notes');
    }
    function printPage() {
      beforePrint();
      window.print();
      afterPrint();
    }
    window.addEventListener('focus', afterPrint);

    document.getElementById('printBtn').addEventListener('click', printPage);
    document.getElementById('prevWeek').addEventListener('click', () => navigate(-1));
    document.getElementById('nextWeek').addEventListener('click', () => navigate(1));
    document.getElementById('popupClose').addEventListener('click', closePopup);
    document.getElementById('popupOverlay').addEventListener('click', e => {
      if (e.target === document.getElementById('popupOverlay')) closePopup();
    });
    document.getElementById('addGroupBtn').addEventListener('click', () => {
      registry.push({ name: '', members: [] });
      renderRegistry();
    });
    document.getElementById('addRhythmBtn').addEventListener('click', () => {
      rhythms.push({ name: '', startMinutes: 480 });
      renderRhythms();
    });
    document.getElementById('addSubjectBtn').addEventListener('click', () => {
      const input = document.getElementById('subjectAddCode');
      const errDiv = document.getElementById('subjectAddError');
      const code = normalizeCode(input.value);
      if (!code) { errDiv.textContent = 'Syötä tunnus.'; return; }
      if (subjects.find(x => x.code === code)) { errDiv.textContent = 'Tunnus on jo käytössä.'; return; }
      errDiv.textContent = '';
      subjects.push({ code, name: '', color: '#9ca3af' });
      saveSubjects();
      input.value = '';
      renderSubjectsSection();
    });
    document.getElementById('popupResetTime').addEventListener('click', () => {
      if (!popupState) return;
      const { dayIdx, slotIdx } = popupState;
      const key = getWeekKey(currentWeekOffset);
      const cell = ((weekData[key] || {})[DAYS[dayIdx]] || {})[String(slotIdx)];
      if (cell) { delete cell.startOverride; delete cell.endOverride; }
      const t = computeCascadingSlotTime(dayIdx, slotIdx, key);
      document.getElementById('popupStartTime').value = minToTime(t.start);
      document.getElementById('popupEndTime').value = minToTime(t.end);
      document.getElementById('popupTimeRow').classList.remove('has-override');
    });
    document.getElementById('copySlotBtn').addEventListener('click', () => {
      if (!popupState) return;
      const { dayIdx, slotIdx } = popupState;
      const key = getWeekKey(currentWeekOffset);
      const tgtDay = parseInt(document.getElementById('copyTargetDay').value);
      const tgtSlot = parseInt(document.getElementById('copyTargetSlot').value);
      const startVal = document.getElementById('popupStartTime').value;
      const endVal = document.getElementById('popupEndTime').value;
      const startMin = parseInt(startVal.split(':')[0]) * 60 + parseInt(startVal.split(':')[1]);
      const endMin = parseInt(endVal.split(':')[0]) * 60 + parseInt(endVal.split(':')[1]);
      const computed = computeDaySlotTime(dayIdx, slotIdx);
      const hasOverride = startMin !== computed.start || endMin !== computed.end;
      if (!weekData[key]) weekData[key] = {};
      if (!weekData[key][DAYS[tgtDay]]) weekData[key][DAYS[tgtDay]] = {};
      const copy = { participants: [...popupParticipants], text: document.getElementById('popupText').value, subjects: [...popupSubjects] };
      if (hasOverride) { copy.startOverride = startMin; copy.endOverride = endMin; }
      weekData[key][DAYS[tgtDay]][String(tgtSlot)] = copy;
      dirty = true;
      renderGrid();
      const fb = document.getElementById('copySlotFeedback');
      fb.textContent = '✓ Kopioitu';
      setTimeout(() => { fb.textContent = ''; }, 1500);
    });

    dayBreaks = defaultDayBreaks();
    registry = [];
    loadSubjects();
    updateHeader();
    renderGrid();
    loadNotesFromWeek(getWeekKey(currentWeekOffset));
    renderNotes(); renderTodos();
    renderRegistry();
    renderRhythms();
    renderBreaksEditor();
    renderSubjectsSection();
    document.getElementById('clearLunchBtn').addEventListener('click', () => {
      document.getElementById('lunchStartInput').value = '';
    });
    document.getElementById('supervisionBtn').addEventListener('click', () => {
      const btn = document.getElementById('supervisionBtn');
      const active = btn.dataset.active !== '1';
      btn.dataset.active = active ? '1' : '0';
      btn.style.background = active ? '#dbeafe' : 'white';
      btn.style.borderColor = active ? '#3b82f6' : '#d1d5db';
      btn.style.color = active ? '#1d4ed8' : '';
      btn.style.fontWeight = active ? '600' : '';
    });
    document.getElementById('clearCellBtn').addEventListener('click', () => {
      if (!popupState) return;
      popupParticipants = [];
      popupSubjects = [];
      document.getElementById('popupText').value = '';
      document.getElementById('lunchStartInput').value = '';
      const supBtn = document.getElementById('supervisionBtn');
      supBtn.dataset.active = '0';
      supBtn.style.background = 'white'; supBtn.style.borderColor = '#d1d5db';
      supBtn.style.color = ''; supBtn.style.fontWeight = '';
      const timeRow = document.getElementById('popupTimeRow');
      timeRow.classList.remove('has-override');
      const { dayIdx, slotIdx } = popupState;
      const key = getWeekKey(currentWeekOffset);
      if (weekData[key]?.[DAYS[dayIdx]]) delete weekData[key][DAYS[dayIdx]][String(slotIdx)];
      dirty = true;
      renderPopupParticipants();
      renderPopupSubjects();
      renderGrid();
    });
    checkForStoredHandle();
  </script>

</body>
</html>
